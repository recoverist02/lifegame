      function toArray(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val.filter(v => v != null);
        if (typeof val === 'object') {
          return Object.keys(val).sort((a, b) => Number(a) - Number(b)).map(k => val[k]).filter(v => v != null);
        }
        return [];
      }

      function todayKst() {
        return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      }

      function shiftDateKey(key, days) {
        const d = new Date(key + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() + days);
        return d.toISOString().slice(0, 10);
      }

      function seasonForDate(date) {
        if (date < '2026-11-01') return { id: 'TEST', number: 0, name: '베타테스트', start: '2026-01-01', end: '2026-10-31' };
        const [y, m] = date.split('-').map(Number);
        const offset = (y - 2026) * 12 + m - 11;
        const n = Math.floor(offset / 3);
        const start = new Date(Date.UTC(2026, 10 + n * 3, 1));
        const next = new Date(Date.UTC(2026, 13 + n * 3, 1));
        return {
          id: 'S' + String(n + 1).padStart(3, '0'),
          number: n + 1,
          name: (n + 1) + '시즌',
          start: start.toISOString().slice(0, 10),
          end: new Date(+next - 86400000).toISOString().slice(0, 10)
        };
      }

      function allSeasonsUpToToday() {
        const list = [{ id: 'TEST', number: 0, name: '베타테스트', start: '2026-01-01', end: '2026-10-31' }];
        const cur = seasonForDate(todayKst());
        for (let i = 1; i <= Math.max(1, cur.number); i++) {
          const start = new Date(Date.UTC(2026, 10 + (i - 1) * 3, 1));
          const next = new Date(Date.UTC(2026, 13 + (i - 1) * 3, 1));
          list.push({
            id: 'S' + String(i).padStart(3, '0'),
            number: i,
            name: i + '시즌',
            start: start.toISOString().slice(0, 10),
            end: new Date(+next - 86400000).toISOString().slice(0, 10)
          });
        }
        return list;
      }

      window.__lifeQuestHybridCall = async (pathname, req) => {

        }

        if (action === 'read' && initialReadDone) {
          const [freshFb, freshMeta] = await Promise.all([fetchFbClient(), fetchFbMeta()]);
          if (freshFb && freshFb.records.length) cachedClient = freshFb;
          if (freshMeta) cachedMeta = freshMeta;
        }

        let client = cachedClient || (await prefetchClientPromise);
        let meta = cachedMeta || (await prefetchMetaPromise);

        if (!client || !Array.isArray(client.records) || !client.records.length) {
          try {
            const getRes = await fetch(GAS_URL + '?action=read', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null);
            const normGet = normalizeClient(getRes);
            if (normGet && normGet.records.length) {
              client = normGet;
              cachedClient = client;
              await writeFb('client', client);
            } else {
              const sheetData = await bridgeCall({ action: 'syncAndRead' });

                cachedClient = client;
                await writeFb('client', client);
              }
            }
          } catch (_) {}

          }

          initialReadDone = true;

              .then(async fresh => {
                if (fresh && Array.isArray(fresh.records)) {
                  saveSyncedAutoCache(fresh.records);
                }

                  const afterSig = clientRecordSignature(norm);
                  cachedClient = norm;
                  await writeFb('client', norm);

          '    try { navigator.serviceWorker.register = () => Promise.resolve(); } catch (_) {}\n' +
          '  }\n' +
          '  const origFetch = window.fetch.bind(window);\n' +
          '  window.fetch = async (input, init = {}) => {\n' +
          '    const raw = typeof input === "string" ? input : (input && input.url ? input.url : "");\n' +
          '    let u;\n' +
          '    try { u = new URL(raw, "https://recoverist02.github.io"); } catch (_) { return origFetch(input, init); }\n' +
          '    if (!u.pathname.endsWith("/api/game") && !u.pathname.endsWith("/api/ai")) {\n' +
          '      return origFetch(input, init);\n' +
          '    }\n' +
          '    let body = {};\n' +
          '    if (init && init.body) { try { body = JSON.parse(init.body); } catch (_) {} }\n' +
          '    try {\n' +
          '      const res = await window.parent.__lifeQuestHybridCall(u.pathname, body);\n' +
          '      return new Response(JSON.stringify(res || { ok: false, error: "SERVER_ERROR" }), {\n' +
          '        status: 200,\n' +
          '        headers: { "Content-Type": "application/json" }\n' +
          '      });\n' +
          '    } catch (err) {\n' +
          '      return new Response(JSON.stringify({ ok: false, error: err && err.code ? err.code : "CONNECTION_FAILED" }), {\n' +
          '        status: 200,\n' +
          '        headers: { "Content-Type": "application/json" }\n' +
          '      });\n' +
          '    }\n' +
          '  };\n' +
          '})();\n' +
          closeTag;

        const cfRe = new RegExp('<script>\\(function\\(\\)\\{function c\\(\\)[\\s\\S]*?<' + '/script>', 'gi');

        let cleaned = String(rawHtml || '')
          .replace(cfRe, '')
          .replace("navigator.serviceWorker.register('/sw.js'", "Promise.resolve('/sw.js'")
          .replace(/location\.reload\(\)/g, 'window.top.location.reload()')
          .replaceAll('adventurer-fullbody-v1.webp', ADVENTURER_SVG)
          .replaceAll('profile-adventurer.webp', ADVENTURER_SVG)
          .replaceAll('woodland-backdrop-v1.webp', BANNER_SVG)
          .replaceAll('journal-banner.webp', BANNER_SVG)
          .replaceAll('inventory-banner.webp', BANNER_SVG);

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (m) => m + shim);
        }
        return shim + cleaned;
      }

      async function boot() {
        let text = await prefetchShellPromise;
        if (!text) {
          try {
            const r = await fetch('./인생게임%20site%20html%20소스.txt');
            if (r.ok) text = await r.text();
          } catch (_) {}
        }
        if (text && text.includes('LIFE QUEST')) {
          await Promise.all([prefetchClientPromise, prefetchMetaPromise]);
          appFrame.onload = () => bootOverlay.classList.add('hidden');
          appFrame.srcdoc = injectBridgeIntoAppHtml(text);
          setTimeout(() => bootOverlay.classList.add('hidden'), 150);
          return;
        }
        bootStatus.innerHTML = '깃허브 저장소에 <b>app.html</b> 파일을 함께 업로드해 주세요.';
      }

      boot();
    })();
  </script>
