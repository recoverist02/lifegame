<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071a20" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Life Quest · 오늘의 기록</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #061419;
      color: #f7f1df;
      font-family: ui-serif, Georgia, "Noto Serif KR", serif;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #061419;
      z-index: 1;
    }
    #bootOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: radial-gradient(ellipse at 50% -10%, #34535a 0, #142f37 38%, #07191f 76%);
      z-index: 10;
      transition: opacity 0.15s ease;
    }
    #bootOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-compass {
      font-size: 32px;
      color: #d4ad62;
    }
    .boot-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #f1d28d;
    }
    .boot-sub {
      font-size: 13px;
      color: #b9c3b8;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="bootOverlay">
    <div class="boot-compass">✦</div>
    <div class="boot-title">LIFE QUEST</div>
    <div class="boot-sub" id="bootStatus">클라우드에서 모험 기록을 초고속으로 불러오는 중…</div>
  </div>

  <iframe id="appFrame" title="Life Quest · 오늘의 기록"></iframe>

  <script>
    (() => {
      const FIREBASE_DB_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app';
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbzPA41nh-YQj0qTVRgGWM_X3mDsgxQyaaHv6J1I9MPotcV6dEe-YO3h0PRgiSIoM6vD/exec';
      const CHANNEL = 'lifequest-sheets-v1';

      const appFrame = document.getElementById('appFrame');
      const bootOverlay = document.getElementById('bootOverlay');
      const bootStatus = document.getElementById('bootStatus');
      const cleanFbUrl = FIREBASE_DB_URL.replace(/\/+$/, '');

      function toArray(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val.filter(v => v != null);
        if (typeof val === 'object') {
          return Object.keys(val).sort((a, b) => Number(a) - Number(b)).map(k => val[k]).filter(v => v != null);
        }
        return [];
      }

      function todayKst() {
        return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      }

      function seasonForDate(date) {
        if (date < '2026-11-01') return { id: 'TEST', number: 0, name: '베타테스트', start: '2026-01-01', end: '2026-10-31' };
        const [y, m] = date.split('-').map(Number);
        const offset = (y - 2026) * 12 + m - 11;
        const n = Math.floor(offset / 3);
        const start = new Date(Date.UTC(2026, 10 + n * 3, 1));
        const next = new Date(Date.UTC(2026, 13 + n * 3, 1));
        return {
          id: 'S' + String(n + 1).padStart(3, '0'),
          number: n + 1,
          name: (n + 1) + '시즌',
          start: start.toISOString().slice(0, 10),
          end: new Date(+next - 86400000).toISOString().slice(0, 10)
        };
      }

      function allSeasonsUpToToday() {
        const list = [{ id: 'TEST', number: 0, name: '베타테스트', start: '2026-01-01', end: '2026-10-31' }];
        const cur = seasonForDate(todayKst());
        for (let i = 1; i <= Math.max(1, cur.number); i++) {
          const start = new Date(Date.UTC(2026, 10 + (i - 1) * 3, 1));
          const next = new Date(Date.UTC(2026, 13 + (i - 1) * 3, 1));
          list.push({
            id: 'S' + String(i).padStart(3, '0'),
            number: i,
            name: i + '시즌',
            start: start.toISOString().slice(0, 10),
            end: new Date(+next - 86400000).toISOString().slice(0, 10)
          });
        }
        return list;
      }

      const ACTIVITIES_XP = {
        steps: 6, protein: 4, supplements: 4, strength: 20, sleep: 12, cardio: 22,
        english: 8, blog: 60, reading: 80, budget: 18, repayment: 200,
        smalltalk: 6, eyecontact: 6, bedtime: 6, sobriety: 8, 'gambling-free': 8,
        moderation: 8, meditation: 6, journal: 18, ga: 25, shuffle: 60, hiking: 250, marathon: 300
      };

      const ZERO_STATS = { vitality: 0, agility: 0, intelligence: 0, willpower: 0, charisma: 0 };

      function normalizeClient(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const map = new Map();
        for (const r of toArray(raw.records)) {
          if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(String(r.date || '')) || !r.activityId) continue;
          const date = String(r.date);
          const activityId = String(r.activityId);
          const sId = seasonForDate(date).id;
          const key = `${sId}|${date}|${activityId}`;
          const done = r.done === true;
          const xp = Number.isSafeInteger(Number(r.xp)) && Number(r.xp) >= 0 ? Number(r.xp) : 0;
          const version = Number.isInteger(Number(r.version)) && Number(r.version) >= 0 ? Number(r.version) : 1;
          const isReading = r.source === 'READING_SHEET' || activityId === 'reading';
          const sourceCount = isReading
            ? (done ? Math.max(1, Math.floor(Number(r.sourceCount) || 1)) : 0)
            : (Number(r.sourceCount) || (done ? 1 : 0));

          const item = {
            recordId: key,
            seasonId: sId,
            date,
            activityId,
            done,
            xp,
            version,
            deleted: r.deleted === true,
            ...(r.source ? {
              source: r.source,
              settled: typeof r.settled === 'boolean' ? r.settled : true,
              sourceCount,
              ...(r.source === 'HEALTH_SHEET' ? { sourceValue: r.sourceValue ?? null, collected: !!r.collected } : {}),
              ...(r.settlesAt ? { settlesAt: r.settlesAt } : {})
            } : {})
          };

          const prev = map.get(key);
          if (!prev || item.version >= prev.version) {
            map.set(key, item);
          }
        }

        const growthFloors = toArray(raw.growthFloors).map(g => ({
          seasonId: String(g.seasonId || 'S001'),
          points: Number(g.points) || 0,
          through: String(g.through || ''),
          settledAt: String(g.settledAt || '')
        }));

        const adventuresBySeason = raw.adventuresBySeason && typeof raw.adventuresBySeason === 'object' ? raw.adventuresBySeason : {};
        for (const [k, v] of Object.entries(adventuresBySeason)) {
          if (v && typeof v === 'object') v.entries = toArray(v.entries);
        }

        return {
          ...raw,
          ok: true,
          records: [...map.values()],
          growthFloors,
          adventuresBySeason,
          sync: raw.sync || {}
        };
      }

      function normalizeMeta(raw) {
        const m = raw && typeof raw === 'object' ? raw : {};
        const statsBySeason = m.statsBySeason && typeof m.statsBySeason === 'object' ? m.statsBySeason : {};
        const skillsBySeason = m.skillsBySeason && typeof m.skillsBySeason === 'object' ? m.skillsBySeason : {};
        for (const [k, v] of Object.entries(skillsBySeason)) {
          if (v && v.state) {
            v.state.learned = toArray(v.state.learned);
            v.state.legends = toArray(v.state.legends).map(l => ({ ...l, ingredients: toArray(l.ingredients), trees: toArray(l.trees) }));
          }
        }
        return {
          statsBySeason,
          skillsBySeason,
          rewards: toArray(m.rewards),
          ai: m.ai || { configured: false, month: todayKst().slice(0, 7), used: 0, limit: 10, jobs: [] }
        };
      }

      let cachedClient = null;
      let cachedMeta = null;
      let lastBackgroundSyncAt = 0;

      const prefetchShellPromise = fetch('./app.html')
        .then(r => (r.ok ? r.text() : null))
        .catch(() => null);

      const prefetchClientPromise = fetch(`${cleanFbUrl}/lifequest/client.json`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          const norm = normalizeClient(d);
          if (norm && norm.records.length) cachedClient = norm;
          return cachedClient;
        })
        .catch(() => null);

      const prefetchMetaPromise = fetch(`${cleanFbUrl}/lifequest/meta.json`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          cachedMeta = normalizeMeta(d);
          return cachedMeta;
        })
        .catch(() => normalizeMeta(null));

      let bridgeSource = null;
      let resolveBridgeReady = null;
      const pending = new Map();
      const bridgeReady = new Promise(resolve => { resolveBridgeReady = resolve; });

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        if (!host.endsWith('-script.googleusercontent.com') || !event.data || event.data.channel !== CHANNEL) return;
        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = pending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      const bridgeFrame = document.createElement('iframe');
      bridgeFrame.title = 'Life Quest 시트·Tasks 백업 연결';
      bridgeFrame.setAttribute('aria-hidden', 'true');
      bridgeFrame.tabIndex = -1;
      bridgeFrame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0;opacity:0';
      bridgeFrame.src = GAS_URL + '?bridge=1';
      document.body.appendChild(bridgeFrame);

      async function bridgeCall(payload) {
        let waitTimer;
        await Promise.race([
          bridgeReady,
          new Promise((_, reject) => {
            waitTimer = setTimeout(() => reject(new Error('시트 브리지 연결 대기 초과')), 15000);
          })
        ]).finally(() => clearTimeout(waitTimer));

        return new Promise((resolve, reject) => {
          const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('시트 브리지 응답 시간 초과'));
          }, 25000);
          pending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({ channel: CHANNEL, id, payload }, '*');
        });
      }

      async function writeFb(path, data) {
        try {
          await fetch(`${cleanFbUrl}/lifequest/${path}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } catch (_) {}
      }

      async function syncRecoveryHabitToGrowthDashboard(activityId, records) {
        if (!['sobriety', 'gambling-free', 'moderation'].includes(activityId)) return;
        try {
          const res = await fetch(`${cleanFbUrl}/growth/data.json`, { cache: 'no-store' });
          if (!res.ok) return;
          const growthData = await res.json();
          if (!growthData || !Array.isArray(growthData.habitData)) return;
          const habit = growthData.habitData.find(h => h && h.id === activityId);
          if (!habit) return;
          const doneDates = [...new Set(records.filter(r => r.activityId === activityId && r.done && !r.deleted).map(r => r.date))].sort();
          habit.dates = doneDates;
          if (doneDates.length && (!habit.startDate || doneDates[0] < habit.startDate)) {
            habit.startDate = doneDates[0];
          }
          await fetch(`${cleanFbUrl}/growth/data.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(growthData)
          });
        } catch (_) {}
      }

      function buildCareerForSeason(seasonId, records, meta) {
        const sObj = allSeasonsUpToToday().find(s => s.id === seasonId) || seasonForDate(todayKst());
        const stats = meta.statsBySeason?.[seasonId]?.values || ZERO_STATS;
        const topEntry = Object.entries(stats).sort((a, b) => b[1] - a[1])[0] || ['willpower', 0];
        const jobMap = {
          vitality: { name: '선봉 돌격기사', mode: '전투 계열', rarity: '왕립 정예', tree: 'combat', description: '강인한 체력으로 전선을 돌파하는 전위 기사.', reason: '체력 능력치 우세', effect: { name: '강철 추진력', text: '체력 판정 보너스' }, appearance: { theme: 'ember', scene: 'battlement', costume: '붉은 강철 견갑과 기사단 망토', palette: '진홍과 강철', background: '왕성 성벽', prop: '⚔', propLabel: '돌격 대검' } },
          intelligence: { name: '왕립 비전학자', mode: '마법 계열', rarity: '왕립 정예', tree: 'magic', description: '지식과 탐구로 세계의 규칙을 해석하는 마도 학자.', reason: '지능 능력치 우세', effect: { name: '현실 주석', text: '지능 판정 보너스' }, appearance: { theme: 'arcane', scene: 'library', costume: '별빛 학자 로브', palette: '자수정과 은빛', background: '왕립 대도서관', prop: '🔮', propLabel: '비전 보주' } },
          charisma: { name: '황금비율 연금술사', mode: '연금술 계열', rarity: '왕립 정예', tree: 'alchemy', description: '대화와 조합으로 불가능한 거래를 성사시키는 연금술사.', reason: '매력 능력치 우세', effect: { name: '만능 배합', text: '매력 판정 보너스' }, appearance: { theme: 'elixir', scene: 'laboratory', costume: '연금술사 가죽 앞치마와 예복', palette: '에메랄드와 황동', background: '연금술 공방', prop: '⚗️', propLabel: '비약 플라스크' } },
          willpower: { name: '불굴의 성채수호자', mode: '수호 계열', rarity: '왕립 정예', tree: 'guardian', description: '유혹과 폭풍 앞에서도 흔들리지 않는 규율의 수호자.', reason: '의지 능력치 우세', effect: { name: '철벽 결재', text: '의지 판정 보너스' }, appearance: { theme: 'ward', scene: 'gate', costume: '수호자 성기사 망토', palette: '청록과 황금', background: '변경 성문', prop: '🛡️', propLabel: '수호 방패' } },
          agility: { name: '바람길 개척자', mode: '탐험 계열', rarity: '왕립 정예', tree: 'explore', description: '누구보다 먼저 움직여 숨겨진 길을 찾아내는 탐험가.', reason: '민첩 능력치 우세', effect: { name: '샛길 발견', text: '민첩 판정 보너스' }, appearance: { theme: 'teal', scene: 'woodland', costume: '경량 정찰 망토', palette: '숲빛과 가죽', background: '초보자의 숲', prop: '🧭', propLabel: '탐험 나침반' } }
        };
        const chosen = jobMap[topEntry[0]] || jobMap.willpower;
        const current = {
          round: 1,
          at: sObj.start + 'T03:00:00.000Z',
          job: chosen,
          appearance: chosen.appearance
        };
        return {
          ok: true,
          season: seasonId,
          beta: seasonId === 'TEST',
          current,
          history: [current],
          next: null,
          seasons: allSeasonsUpToToday()
        };
      }

      window.__lifeQuestHybridCall = async (pathname, req) => {
        const started = Date.now();
        const today = todayKst();
        const activeSeason = seasonForDate(today);

        if (pathname.endsWith('/api/ai')) {
          const meta = cachedMeta || (await prefetchMetaPromise);
          return { ok: true, ...(meta.ai || { configured: false, month: today.slice(0, 7), used: 0, limit: 10, jobs: [] }) };
        }

        let client = cachedClient || (await prefetchClientPromise);
        let meta = cachedMeta || (await prefetchMetaPromise);

        if (!client || !Array.isArray(client.records)) {
          try {
            const sheetData = await bridgeCall({ action: 'syncAndRead' });
            client = normalizeClient(sheetData) || { ok: true, records: [], growthFloors: [], adventuresBySeason: {}, sync: {} };
          } catch (_) {
            client = { ok: true, records: [], growthFloors: [], adventuresBySeason: {}, sync: {} };
          }
          cachedClient = client;
        }

        const action = req && req.action;

        if (action === 'read') {
          if (Date.now() - lastBackgroundSyncAt > 20000) {
            lastBackgroundSyncAt = Date.now();
            bridgeCall({ action: 'syncAndRead' })
              .then(fresh => {
                const norm = normalizeClient(fresh);
                if (norm && norm.records.length) cachedClient = norm;
              })
              .catch(() => {});
          }
          const career = buildCareerForSeason(activeSeason.id, client.records, meta);
          return {
            ok: true,
            records: client.records,
            growthFloors: client.growthFloors,
            career,
            sync: client.sync || {},
            timing: { totalMs: Date.now() - started }
          };
        }

        if (action === 'set') {
          const date = String(req.date || today);
          const activityId = String(req.activityId || '');
          const done = req.done === true;
          const xp = done ? (ACTIVITIES_XP[activityId] || 0) : 0;
          const sId = seasonForDate(date).id;
          const recId = `${sId}|${date}|${activityId}`;

          const idx = client.records.findIndex(r => r.date === date && r.activityId === activityId);
          const oldVer = idx >= 0 ? (client.records[idx].version || 0) : 0;
          const newRec = {
            recordId: recId,
            seasonId: sId,
            date,
            activityId,
            done,
            xp,
            version: Math.max(oldVer, Number(req.expectedVersion) || 0) + 1,
            deleted: false
          };

          if (idx >= 0) client.records[idx] = newRec;
          else client.records.push(newRec);

          cachedClient = client;
          await writeFb('client', client);
          syncRecoveryHabitToGrowthDashboard(activityId, client.records);

          bridgeCall({ action: 'set', date, activityId, done, expectedVersion: newRec.version - 1 })
            .then(res => {
              if (res && res.adventures && cachedClient.sync) {
                cachedClient.sync.adventure = res.adventures;
              }
            })
            .catch(() => {});

          return {
            ok: true,
            record: newRec,
            taskSyncPending: false,
            adventures: client.sync?.adventure || null,
            timing: { totalMs: Date.now() - started }
          };
        }

        if (action === 'stats-read') {
          const alloc = meta.statsBySeason?.[activeSeason.id] || { values: { ...ZERO_STATS }, revision: 0 };
          const skillSpent = meta.skillsBySeason?.[activeSeason.id]?.state?.spentPoints || 0;
          return { ok: true, allocation: alloc, skillSpent, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'stats-save') {
          const sId = req.season || activeSeason.id;
          const nextRev = (Number(req.expectedRevision) || 0) + 1;
          meta.statsBySeason[sId] = { values: { ...ZERO_STATS, ...(req.values || {}) }, revision: nextRev };
          cachedMeta = meta;
          await writeFb('meta', meta);
          bridgeCall({ action: 'adventure-stats', adventureStats: { season: sId, revision: nextRev, values: meta.statsBySeason[sId].values } }).catch(() => {});
          const skillSpent = meta.skillsBySeason?.[sId]?.state?.spentPoints || 0;
          return { ok: true, allocation: meta.statsBySeason[sId], skillSpent, adventureSyncPending: false, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'skills-read') {
          const sId = req.season || activeSeason.id;
          const sObj = allSeasonsUpToToday().find(s => s.id === sId) || activeSeason;
          const skillEntry = meta.skillsBySeason?.[sId] || { state: { schema: 1, learned: [], legends: [], ultimate: null, spentPoints: 0 }, revision: 0 };
          const xp = client.records.reduce((sum, r) => sum + (r.done && !r.deleted && r.settled !== false && r.date >= sObj.start && r.date <= sObj.end ? r.xp : 0), 0);
          const level = Math.floor(xp / 100) + 1;
          const stats = meta.statsBySeason?.[sId]?.values || ZERO_STATS;
          const earned = client.growthFloors.find(g => g.seasonId === sId)?.points || Math.floor(xp / 100) * 3;
          const allocated = Object.values(stats).reduce((a, b) => a + Number(b || 0), 0);
          const spent = skillEntry.state.spentPoints || 0;
          return {
            ok: true,
            season: sId,
            seasons: allSeasonsUpToToday(),
            state: skillEntry.state,
            revision: skillEntry.revision || 0,
            eligibility: { level, stats, remaining: Math.max(0, earned - allocated - spent) },
            timing: { totalMs: Date.now() - started }
          };
        }

        if (['skills-learn', 'skills-fuse', 'skills-ultimate'].includes(action)) {
          const sId = req.season || activeSeason.id;
          const sObj = allSeasonsUpToToday().find(s => s.id === sId) || activeSeason;
          const skillEntry = meta.skillsBySeason?.[sId] || { state: { schema: 1, learned: [], legends: [], ultimate: null, spentPoints: 0 }, revision: 0 };
          const xp = client.records.reduce((sum, r) => sum + (r.done && !r.deleted && r.settled !== false && r.date >= sObj.start && r.date <= sObj.end ? r.xp : 0), 0);
          const level = Math.floor(xp / 100) + 1;
          const stats = meta.statsBySeason?.[sId]?.values || ZERO_STATS;
          const cost = Number(req.expectedCost) || 2;
          const at = new Date().toISOString();

          if (action === 'skills-learn' && !skillEntry.state.learned.some(x => x.id === req.skillId)) {
            skillEntry.state.learned.push({ id: req.skillId, at, level, stats: { ...stats } });
            skillEntry.state.spentPoints = (skillEntry.state.spentPoints || 0) + cost;
          } else if (action === 'skills-fuse') {
            const ing = toArray(req.ingredients);
            skillEntry.state.legends.push({ id: 'legend:' + ing.join('+'), kind: 'legend', name: '합성 전설 비전', description: '세 분기 비전이 결합된 전설 기술.', ingredients: ing, at, level, order: skillEntry.state.legends.length + 1 });
            skillEntry.state.spentPoints = (skillEntry.state.spentPoints || 0) + cost;
          } else if (action === 'skills-ultimate') {
            skillEntry.state.ultimate = { id: 'ultimate:vision', kind: 'ultimate', name: '궁극의 왕립 비전', description: '세 전설이 하나로 완성된 궁극 기술.', ingredients: skillEntry.state.legends.map(l => l.id), at, level };
            skillEntry.state.spentPoints = (skillEntry.state.spentPoints || 0) + cost;
          }
          skillEntry.revision = (skillEntry.revision || 0) + 1;
          meta.skillsBySeason[sId] = skillEntry;
          cachedMeta = meta;
          await writeFb('meta', meta);

          const earned = client.growthFloors.find(g => g.seasonId === sId)?.points || Math.floor(xp / 100) * 3;
          const allocated = Object.values(stats).reduce((a, b) => a + Number(b || 0), 0);
          return {
            ok: true,
            state: skillEntry.state,
            revision: skillEntry.revision,
            remaining: Math.max(0, earned - allocated - (skillEntry.state.spentPoints || 0)),
            timing: { totalMs: Date.now() - started }
          };
        }

        if (action === 'adventures-read') {
          const sId = req.season || activeSeason.id;
          let adv = client.adventuresBySeason?.[sId];
          if (!adv) {
            const res = await bridgeCall({ action: 'adventures-read', season: sId, before: req.before }).catch(() => null);
            adv = res?.adventures || { enabled: true, season: sId, xp: 0, consumed: 0, baseline: 0, progress: 0, nextXp: 100, gold: 0, count: 0, lastError: '', entries: [], nextBefore: null };
          }
          return { ok: true, adventures: adv, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'season-report-read') {
          const sId = req.seasonId || activeSeason.id;
          const seasons = allSeasonsUpToToday();
          const season = seasons.find(s => s.id === sId) || activeSeason;
          const sRecords = client.records.filter(r => r.date >= season.start && r.date <= season.end);
          return { ok: true, season, seasons, records: sRecords, activities: [], timing: { totalMs: Date.now() - started } };
        }

        if (action === 'seasons-read') {
          const seasons = allSeasonsUpToToday();
          const summaries = seasons.map(s => {
            const sRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.date >= s.start && r.date <= s.end);
            return { season_id: s.id, records: sRecs.length, recorded_xp: sRecs.reduce((sum, r) => sum + r.xp, 0) };
          });
          const archivedStats = Object.entries(meta.statsBySeason || {}).map(([seasonId, v]) => ({ seasonId, values: v.values || ZERO_STATS }));
          return { ok: true, seasons, summaries, archivedStats, activities: [], timing: { totalMs: Date.now() - started } };
        }

        if (action === 'rewards-read') {
          return { ok: true, rewards: meta.rewards || [], timing: { totalMs: Date.now() - started } };
        }

        if (action === 'reward-claim') {
          const sId = req.season || activeSeason.id;
          const rewardId = `${sId}:${req.questId}:${req.stage}`;
          let reward = (meta.rewards || []).find(r => r.reward_id === rewardId);
          if (!reward) {
            const sRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.date >= activeSeason.start && r.date <= today);
            const xp = sRecs.reduce((sum, r) => sum + r.xp, 0);
            const count = sRecs.filter(r => r.activityId === req.questId).reduce((sum, r) => sum + (req.questId === 'reading' ? (r.sourceCount || 1) : 1), 0);
            const career = buildCareerForSeason(sId, client.records, meta);
            reward = {
              reward_id: rewardId,
              quest_id: req.questId,
              stage: Number(req.stage) || 1,
              season: sId,
              claimed_at: new Date().toISOString(),
              snapshot: { count, threshold: count, level: Math.floor(xp / 100) + 1, job: career.current?.job?.name || '견습 모험가' }
            };
            meta.rewards = [reward, ...(meta.rewards || [])];
            cachedMeta = meta;
            await writeFb('meta', meta);
          }
          return { ok: true, reward, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'careers-read') {
          const sId = req.season || activeSeason.id;
          return { ...buildCareerForSeason(sId, client.records, meta), timing: { totalMs: Date.now() - started } };
        }

        if (action === 'profile-read') {
          const sRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.date >= activeSeason.start && r.date <= today);
          const activeDaysSet = new Set(sRecs.map(r => r.date));
          const seasonRewards = (meta.rewards || []).filter(r => r.season === activeSeason.id);
          const career = buildCareerForSeason(activeSeason.id, client.records, meta);

          const achievements = [
            { id: 'first', icon: '🌱', name: '첫 발자국', description: '이번 시즌 첫 활동 완료', title: '첫 기록의 목격자', count: sRecs.length, target: 1, unit: '건', unlocked: sRecs.length >= 1 },
            { id: 'days7', icon: '🔥', name: '일주일의 불꽃', description: '시즌 누적 활동일 7일 달성', title: '꾸준함의 순례자', count: activeDaysSet.size, target: 7, unit: '일', unlocked: activeDaysSet.size >= 7 },
            { id: 'days30', icon: '🛡️', name: '강철의 일과', description: '시즌 누적 활동일 30일 달성', title: '규율의 수호자', count: activeDaysSet.size, target: 30, unit: '일', unlocked: activeDaysSet.size >= 30 },
            { id: 'records50', icon: '⚔️', name: '백전의 실천가', description: '시즌 완료 기록 50건 달성', title: '왕립 실행관', count: sRecs.length, target: 50, unit: '건', unlocked: sRecs.length >= 50 }
          ];
          const unlocked = achievements.filter(a => a.unlocked);
          const sortedDates = [...activeDaysSet].sort();
          const recentDays = [...sortedDates].reverse().slice(0, 5).map(d => {
            const dRecs = sRecs.filter(r => r.date === d);
            return { date: d, count: dRecs.length, xp: dRecs.reduce((sum, r) => sum + r.xp, 0), activities: dRecs.map(r => r.activityId) };
          });

          const formalRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.seasonId !== 'TEST');
          const betaRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.seasonId === 'TEST');

          return {
            ok: true,
            profile: {
              season: activeSeason,
              name: '연수홍',
              completed: sRecs.length,
              activeDays: activeDaysSet.size,
              rewards: seasonRewards.length,
              title: unlocked.length ? unlocked[unlocked.length - 1].title : '',
              career: career.current,
              achievements,
              firstDate: sortedDates[0] || '',
              days: recentDays,
              latestReward: seasonRewards[0] || null,
              participatedSeasons: new Set(formalRecs.map(r => r.seasonId)).size || 1,
              formalCompleted: formalRecs.length,
              betaCompleted: betaRecs.length
            },
            timing: { totalMs: Date.now() - started }
          };
        }

        return { ok: true, timing: { totalMs: Date.now() - started } };
      };

      // 깨진 이미지 없이 모험가 전신 일러스트와 배경을 그려주는 내장 SVG 데이터 URI
      const ADVENTURER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220">' +
        '<defs>' +
        '<radialGradient id="aura" cx="50%" cy="42%" r="48%"><stop offset="0%" stop-color="#f3d58d" stop-opacity="0.45"/><stop offset="65%" stop-color="#58b9b4" stop-opacity="0.18"/><stop offset="100%" stop-color="#071a20" stop-opacity="0"/></radialGradient>' +
        '<linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2b676e"/><stop offset="100%" stop-color="#123138"/></linearGradient>' +
        '<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6de9d"/><stop offset="100%" stop-color="#b88938"/></linearGradient>' +
        '</defs>' +
        '<circle cx="80" cy="96" r="72" fill="url(#aura)"/>' +
        '<circle cx="80" cy="96" r="56" fill="none" stroke="#d4ad62" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 4"/>' +
        '<path d="M44 192 L58 88 L102 88 L116 192 Z" fill="url(#cloak)" stroke="#d4ad62" stroke-width="1.8"/>' +
        '<path d="M54 92 Q80 112 106 92 L112 152 Q80 164 48 152 Z" fill="#1d464d" stroke="#d4ad62" stroke-width="1.4"/>' +
        '<circle cx="80" cy="60" r="20" fill="#eed9b3" stroke="#b88938" stroke-width="2"/>' +
        '<path d="M56 58 Q80 30 104 58 Q80 46 56 58 Z" fill="#17383f" stroke="#d4ad62" stroke-width="1.6"/>' +
        '<rect x="66" y="122" width="28" height="32" rx="4" fill="#243c35" stroke="url(#gold)" stroke-width="2"/>' +
        '<path d="M80 128 L80 148 M70 138 L90 138" stroke="#f6de9d" stroke-width="2"/>' +
        '<line x1="118" y1="48" x2="118" y2="194" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round"/>' +
        '<circle cx="118" cy="44" r="7" fill="#7ee8df" stroke="#f6de9d" stroke-width="2"/>' +
        '</svg>'
      );

      const BANNER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">' +
        '<defs>' +
        '<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2e36"/><stop offset="55%" stop-color="#194249"/><stop offset="100%" stop-color="#07191f"/></linearGradient>' +
        '<radialGradient id="moon" cx="24%" cy="32%" r="35%"><stop offset="0%" stop-color="#f4d894" stop-opacity="0.32"/><stop offset="100%" stop-color="#194249" stop-opacity="0"/></radialGradient>' +
        '</defs>' +
        '<rect width="640" height="260" fill="url(#sky)"/>' +
        '<rect width="640" height="260" fill="url(#moon)"/>' +
        '<path d="M0 210 Q140 160 280 205 T640 185 L640 260 L0 260 Z" fill="#0b2228" opacity="0.85"/>' +
        '<path d="M0 230 Q200 190 410 225 T640 210 L640 260 L0 260 Z" fill="#06151a"/>' +
        '</svg>'
      );

      function injectBridgeIntoAppHtml(rawHtml) {
        const closeTag = '<' + '/script>';
        const shim =
          '<script>\n' +
          '(() => {\n' +
          '  if ("serviceWorker" in navigator) {\n' +
          '    try { navigator.serviceWorker.register = () => Promise.resolve(); } catch (_) {}\n' +
          '  }\n' +
          '  const origFetch = window.fetch.bind(window);\n' +
          '  window.fetch = async (input, init = {}) => {\n' +
          '    const raw = typeof input === "string" ? input : (input && input.url ? input.url : "");\n' +
          '    let u;\n' +
          '    try { u = new URL(raw, "https://recoverist02.github.io"); } catch (_) { return origFetch(input, init); }\n' +
          '    if (!u.pathname.endsWith("/api/game") && !u.pathname.endsWith("/api/ai")) {\n' +
          '      return origFetch(input, init);\n' +
          '    }\n' +
          '    let body = {};\n' +
          '    if (init && init.body) { try { body = JSON.parse(init.body); } catch (_) {} }\n' +
          '    try {\n' +
          '      const res = await window.parent.__lifeQuestHybridCall(u.pathname, body);\n' +
          '      return new Response(JSON.stringify(res || { ok: false, error: "SERVER_ERROR" }), {\n' +
          '        status: 200,\n' +
          '        headers: { "Content-Type": "application/json" }\n' +
          '      });\n' +
          '    } catch (err) {\n' +
          '      return new Response(JSON.stringify({ ok: false, error: err && err.code ? err.code : "CONNECTION_FAILED" }), {\n' +
          '        status: 200,\n' +
          '        headers: { "Content-Type": "application/json" }\n' +
          '      });\n' +
          '    }\n' +
          '  };\n' +
          '})();\n' +
          closeTag;

        const cfRe = new RegExp('<script>\\(function\\(\\)\\{function c\\(\\)[\\s\\S]*?<' + '/script>', 'gi');

        // 중괄호를 건드리지 않고 안전하게 서비스워커 호출과 이미지 경로만 치환
        let cleaned = String(rawHtml || '')
          .replace(cfRe, '')
          .replace("navigator.serviceWorker.register('/sw.js'", "Promise.resolve('/sw.js'")
          .replace(/location\.reload\(\)/g, 'window.top.location.reload()')
          .replaceAll('adventurer-fullbody-v1.webp', ADVENTURER_SVG)
          .replaceAll('profile-adventurer.webp', ADVENTURER_SVG)
          .replaceAll('woodland-backdrop-v1.webp', BANNER_SVG)
          .replaceAll('journal-banner.webp', BANNER_SVG)
          .replaceAll('inventory-banner.webp', BANNER_SVG);

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (m) => m + shim);
        }
        return shim + cleaned;
      }

      async function boot() {
        let text = await prefetchShellPromise;
        if (!text) {
          try {
            const r = await fetch('./인생게임%20site%20html%20소스.txt');
            if (r.ok) text = await r.text();
          } catch (_) {}
        }
        if (text && text.includes('LIFE QUEST')) {
          await Promise.all([prefetchClientPromise, prefetchMetaPromise]);
          appFrame.onload = () => bootOverlay.classList.add('hidden');
          appFrame.srcdoc = injectBridgeIntoAppHtml(text);
          setTimeout(() => bootOverlay.classList.add('hidden'), 150);
          return;
        }
        bootStatus.innerHTML = '깃허브 저장소에 <b>app.html</b> 파일을 함께 업로드해 주세요.';
      }

      boot();
    })();
  </script>
