          id: 'S' + String(n + 1).padStart(3, '0'),

        { id: 'ga', name: 'GA 참석', area: '성찰', xp: 25, criterion: 'GA 출석부 출석 등록 (다음 날 낮 12시 정산)' },

        { id: 'hiking', name: '등산', area: '도전', xp: 250, criterion: '등산 코스 완주' },

      const ZERO_STATS = { vitality: 0, agility: 0, intelligence: 0, willpower: 0, charisma: 0 };

      // 스킬 카탈로그 및 검증 규칙 (app.html과 100% 동일한 서버 권한 검증용)

      const SKILL_TREES = [
        { id: 'combat', name: '전투', stat: 'vitality', statName: '체력', icon: '⚔' },
        { id: 'magic', name: '마법', stat: 'intelligence', statName: '지능', icon: '✦' },
        { id: 'alchemy', name: '연금술', stat: 'charisma', statName: '매력', icon: '⚗' },
        { id: 'guardian', name: '수호', stat: 'willpower', statName: '의지', icon: '🛡' },
        { id: 'explore', name: '탐험', stat: 'agility', statName: '민첩', icon: '🧭' }
      ];
      const SKILL_CATALOG = [
        { id: 'combat-intro', tree: 'combat', kind: 'intro', name: '일단 주먹부터', description: '검술 교본을 펼치기 전에 주먹을 쥐었다. 책은 무사하다.', action: '몸으로 부딪쳐 길을 살핀다' },
        { id: 'combat-a', tree: 'combat', kind: 'branch', name: '정면돌파', description: '문이 잠겼다면 문틀과 협상한다. 대체로 문틀이 양보한다.', action: '장애물의 정면을 돌파한다', lead: '돌격하는', object: '돌주먹', ending: '문틀철거' },
        { id: 'combat-b', tree: 'combat', kind: 'branch', name: '광전사의 야근', description: '체력이 먼저 퇴근을 신청했지만 의욕이 반려했다.', action: '끝까지 밀어붙이며 기회를 만든다', lead: '퇴근 못 한', object: '야근전사', ending: '무한추진' },
        { id: 'magic-intro', tree: 'magic', kind: 'intro', name: '수상한 주문 입문', description: '발음은 틀렸지만 무언가 반응했다. 강사도 처음 본 현상이다.', action: '작은 주문으로 상황을 살핀다' },
        { id: 'magic-a', tree: 'magic', kind: 'branch', name: '폭발도 답이다', description: '문제의 크기를 줄이는 대신 문제 주변을 넓혔다.', action: '폭발 마법으로 돌파구를 노린다', lead: '폭발하는', object: '마력폭탄', ending: '대폭발' },
        { id: 'magic-b', tree: 'magic', kind: 'branch', name: '현실 오류 수정', description: '불가능을 오타로 접수한다. 세계 관리자에게는 비밀이다.', action: '공간의 빈틈과 규칙의 허점을 찾는다', lead: '규칙을 고치는', object: '오류술사', ending: '현실수정' },
        { id: 'alchemy-intro', tree: 'alchemy', kind: 'intro', name: '약장수의 첫걸음', description: '성분 설명보다 눈빛이 자신 있다. 일단 시음은 본인이 한다.', action: '주변 재료의 쓸모를 찾아본다' },
        { id: 'alchemy-a', tree: 'alchemy', kind: 'branch', name: '기적의 혼합물', description: '같이 넣으면 안 된다는 재료끼리 의외로 사이가 좋았다.', action: '손에 잡히는 재료를 섞어 해결책을 만든다', lead: '기적을 섞는', object: '만능물약', ending: '황금배합' },
        { id: 'alchemy-b', tree: 'alchemy', kind: 'branch', name: '수상한 거래술', description: '위기를 기회로, 기회를 정기구독으로 바꾸는 화술.', action: '협상과 교환으로 상황을 풀어본다', lead: '계약하는', object: '약장수', ending: '수상한계약' },
        { id: 'guardian-intro', tree: 'guardian', kind: 'intro', name: '버티면 내 차례', description: '아직 쓰러지지 않았다는 사실로 상대의 계획을 수정시킨다.', action: '자리를 지키며 상황을 살핀다' },
        { id: 'guardian-a', tree: 'guardian', kind: 'branch', name: '철벽 민원실', description: '공격은 접수한다. 통과는 승인하지 않는다.', action: '방패를 세워 위협을 막아낸다', lead: '흔들리지 않는', object: '철벽방패', ending: '철벽결재' },
        { id: 'guardian-b', tree: 'guardian', kind: 'branch', name: '대신 맞는 품격', description: '멋있게 앞을 막아섰다. 치료비 영수증도 품위 있게 챙겼다.', action: '일행 앞에 서서 위험을 대신 감당한다', lead: '모두를 지키는', object: '호위기사', ending: '절대호위' },
        { id: 'explore-intro', tree: 'explore', kind: 'intro', name: '일단 나가보자', description: '지도는 없지만 신발은 신었다. 출발 요건은 충족했다.', action: '주변을 돌아다니며 단서를 살핀다' },
        { id: 'explore-a', tree: 'explore', kind: 'branch', name: '샛길 전문가', description: '정문이 막혔다는 소식에 뒷문도 아니고 옆 지붕을 본다.', action: '남들이 놓친 샛길을 찾아 움직인다', lead: '샛길을 여는', object: '길잡이', ending: '차원우회' },
        { id: 'explore-b', tree: 'explore', kind: 'branch', name: '유물은 내 운명', description: '남들은 잡동사니라 부른다. 감정서는 아직 작성 중이다.', action: '흔적과 수상한 물건에서 실마리를 찾는다', lead: '유물을 깨우는', object: '유물사냥꾼', ending: '보물각성' }
      ];

      function skillById(id) {
        return SKILL_CATALOG.find(s => s.id === id);
      }

      function skillLegend(ids) {
        if (!Array.isArray(ids) || ids.length !== 3 || new Set(ids).size !== 3 || ids.some(id => skillById(id)?.kind !== 'branch')) {
          throw new Error('INVALID_SKILL');
        }
        const skills = SKILL_CATALOG.filter(s => ids.includes(s.id));
        const [a, b, c] = skills;
        return {
          id: 'legend:' + skills.map(s => s.id).join('+'),
          kind: 'legend',
          name: `${a.lead} ${b.object}의 ${c.ending}`,
          description: `「${a.name}」·「${b.name}」·「${c.name}」의 합성 비전. ${a.action}. ${b.action}. ${c.action}. 왕립 특허청은 분류를 포기했다.`,
          ingredients: skills.map(s => s.id),
          trees: [...new Set(skills.map(s => s.tree))]
        };
      }

      function skillUltimate(legends) {
        if (!Array.isArray(legends) || legends.length !== 3 || new Set(legends.flatMap(l => l.ingredients)).size !== 9) {
          throw new Error('INVALID_SKILL');
        }
        const a = skillById(legends[0].ingredients[0]);
        const b = skillById(legends[1].ingredients[1]);
        const c = skillById(legends[2].ingredients[2]);
        return {
          id: 'ultimate:' + legends.map(l => l.id).join('>'),
          kind: 'ultimate',
          name: `궁극: ${a.lead} ${b.object}의 ${c.ending}`,
          description: `핵심 「${legends[0].name}」 → 발현 「${legends[1].name}」 → 완성 「${legends[2].name}」. 세 전설이 하나로 이어졌다. 왕국 재난보험에 새 항목이 생겼다.`,
          ingredients: legends.map(l => l.id),
          trees: SKILL_TREES.map(t => t.id)
        };
      }

      function skillRequirement(state, id, level, stats) {
        const s = skillById(id);
        if (!s) return { allowed: false, reason: '알 수 없는 스킬' };
        if (state.learned.some(x => x.id === id)) return { allowed: false, owned: true, reason: '습득 완료' };
        const tree = SKILL_TREES.find(t => t.id === s.tree);
        const count = state.learned.filter(x => skillById(x.id)?.tree === s.tree && skillById(x.id)?.kind === 'branch').length;
        const minLevel = s.kind === 'intro' ? 1 : count ? 20 : 10;
        const minStat = s.kind === 'intro' ? 3 : count ? 16 : 8;
        const intro = state.learned.some(x => x.id === tree.id + '-intro');
        const cost = s.kind === 'intro' ? SKILL_COSTS.intro : count ? SKILL_COSTS.secondBranch : SKILL_COSTS.firstBranch;
        return {
          cost,
          allowed: level >= minLevel && (stats[tree.stat] || 0) >= minStat && (s.kind === 'intro' || intro),
          minLevel,
          minStat,
          stat: tree.stat,
          statName: tree.statName
        };
      }

      function skillTransition(current, req, { level, stats, at }) {
        const state = JSON.parse(JSON.stringify(current || { schema: SKILL_VERSION, learned: [], legends: [], ultimate: null, spentPoints: 0 }));
        let cost = 0;
        if (req.action === 'skills-learn') {
          if (state.learned.some(s => s.id === req.skillId)) return { state, unchanged: true, cost: 0 };
          const rule = skillRequirement(state, req.skillId, level, stats);
          if (!rule.allowed) throw new Error(skillById(req.skillId) ? 'SKILL_LOCKED' : 'INVALID_SKILL');
          cost = rule.cost;
          state.learned.push({ id: req.skillId, at, level, stats: { ...stats } });
        } else if (req.action === 'skills-fuse') {
          const legend = skillLegend(toArray(req.ingredients));
          if (state.legends.some(l => l.id === legend.id)) return { state, unchanged: true, cost: 0 };
          const used = new Set(state.legends.flatMap(l => l.ingredients));
          const gate = [30, 45, 60][state.legends.length];
          if (!gate || level < gate || legend.ingredients.some(id => used.has(id) || !state.learned.some(s => s.id === id))) {
            throw new Error('SKILL_LOCKED');
          }
          cost = SKILL_COSTS.legend;
          state.legends.push({ ...legend, at, level, order: state.legends.length + 1 });
        } else if (req.action === 'skills-ultimate') {
          if (state.ultimate) return { state, unchanged: true, cost: 0 };
          if (level < 80 || state.legends.length !== 3) throw new Error('SKILL_LOCKED');
          cost = SKILL_COSTS.ultimate;
          state.ultimate = { ...skillUltimate(state.legends), at, level };
        } else {
          throw new Error('INVALID_SKILL');
        }
        state.spentPoints = (Number(current?.spentPoints) || 0) + cost;
        return { state, unchanged: false, cost };
      }

      function normalizeDateStr(v, recordId) {
        if (typeof v === 'number' && Number.isFinite(v) && v > 20000 && v < 100000) {
          return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
        }
        const s = String(v ?? '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        if (/^\d{5}(\.\d+)?$/.test(s)) {
          const num = Number(s);
          if (num > 20000 && num < 100000) {
            return new Date(Math.round((num - 25569) * 86400000)).toISOString().slice(0, 10);
          }
        }
        const mIso = s.match(/^(\d{4})[-/.]\s*(\d{1,2})[-/.]\s*(\d{1,2})/);
        if (mIso) return `${mIso[1]}-${mIso[2].padStart(2, '0')}-${mIso[3].padStart(2, '0')}`;
        const mUs = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (mUs) return `${mUs[3]}-${mUs[1].padStart(2, '0')}-${mUs[2].padStart(2, '0')}`;
        if (recordId) {
          const mKey = String(recordId).match(/(\d{4}-\d{2}-\d{2})/);
          if (mKey) return mKey[1];
        }
        return '';
      }

      // V4 normalizeClient:
      // - INITIAL_SHEET_SEED, 로컬 스냅샷, 자동활동 캐시, 수동 오버라이드 병합을 제거하고 서버 데이터(raw.records)만 신뢰
      // - prev.done && !item.done 강제 보호를 제거하고 오직 version 기준으로 최신 상태를 채택
      // - 브라우저가 임의로 settled=true 및 xp를 생성하지 않고 서버 정산값을 그대로 신뢰 (단, 정산 시각 이전 자동활동은 미정산 강제)
      const VALID_ACTIVITY_IDS = new Set(ACTIVITIES_CATALOG.map(a => a.id));

      function normalizeClient(raw) {
        if (!raw || typeof raw !== 'object') raw = {};
        const nowMs = Date.now();
        const today = todayKst();
        const yesterday = shiftDateKey(today, -1);
        const map = new Map();
        const AUTO_IDS = new Set(['steps', 'sleep', 'bedtime', 'strength', 'cardio', 'ga', 'reading', 'journal']);
        const HEALTH_IDS = new Set(['steps', 'sleep', 'bedtime']);

        for (const r of toArray(raw.records)) {
          if (!r || !r.activityId) continue;
          const date = normalizeDateStr(r.date, r.recordId);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
          const activityId = String(r.activityId);
          if (!VALID_ACTIVITY_IDS.has(activityId)) continue;
          const sId = seasonForDate(date).id;
          const key = `${sId}|${date}|${activityId}`;
          const deleted = r.deleted === true;
          const done = !deleted && r.done === true;
          let xp = done && Number.isSafeInteger(Number(r.xp)) && Number(r.xp) >= 0 ? Number(r.xp) : 0;
          const version = Number.isInteger(Number(r.version)) && Number(r.version) >= 0 ? Number(r.version) : 1;
          const isReading = r.source === 'READING_SHEET' || activityId === 'reading';
          const sourceCount = isReading
            ? (done ? Math.max(1, Math.floor(Number(r.sourceCount) || 1)) : 0)
            : (done ? Math.max(1, Math.floor(Number(r.sourceCount) || 1)) : 0);

          const isAuto = Boolean(r.source) || AUTO_IDS.has(activityId);
          const isHealth = r.source === 'HEALTH_SHEET' || HEALTH_IDS.has(activityId);
          const collectsAt = shiftDateKey(date, 1) + 'T11:10:00+09:00';
          const settlesAt = r.settlesAt || (shiftDateKey(date, 1) + 'T12:00:00+09:00');

          let finalDone = done;
          let finalCollected = isHealth ? Boolean(r.collected) : finalDone;
          let finalSourceValue = r.sourceValue ?? null;
          let settled = isAuto ? Boolean(r.settled) : true;

          // 건강데이터: 다음 날 11:10 이전에는 수집·확정 불가
          if (isHealth && nowMs < Date.parse(collectsAt)) {
            finalDone = false;
            finalCollected = false;
            finalSourceValue = null;
            settled = false;
            xp = 0;
          } else if (isAuto && nowMs < Date.parse(settlesAt)) {
            // 모든 자동활동: 다음 날 낮 12시 이전에는 절대 확정(settled)하지 않음
            settled = false;
            xp = 0;
          } else if (isAuto && !settled) {
            xp = 0;
          }

          const item = {
            recordId: key,
            seasonId: sId,
            date,
            activityId,
            done: Boolean(finalDone),
            xp: finalDone ? xp : 0,
            version,
            deleted: Boolean(deleted),
            ...(r.taskSyncPending ? { taskSyncPending: true } : {}),
            ...(isAuto ? {
              source: r.source || (isHealth ? 'HEALTH_SHEET' : isReading ? 'READING_SHEET' : activityId === 'journal' ? 'JOURNAL_SHEET' : activityId === 'ga' ? 'GA_SHEET' : 'WORKOUT_SHEET'),
              settled,
              sourceCount: finalDone ? sourceCount : (isHealth && finalCollected ? 1 : 0),
              ...(isHealth ? { sourceValue: finalSourceValue, collected: finalCollected } : {}),
              settlesAt
            } : {})
          };

          const prev = map.get(key);
          if (!prev || item.version >= prev.version) {
            map.set(key, item);
          }
        }

        const recordsList = [...map.values()];
        const floorMap = new Map();
        for (const g of toArray(raw.growthFloors)) {
          const sId = String(g.seasonId || 'S001');
          const prev = floorMap.get(sId);
          floorMap.set(sId, {
            seasonId: sId,
            points: Math.max(prev ? prev.points : 0, Number(g.points) || 0),
            through: String(g.through || (prev && prev.through) || yesterday),
            settledAt: String(g.settledAt || (prev && prev.settledAt) || new Date().toISOString())
          });
        }

        for (const s of allSeasonsUpToToday()) {
          if (!floorMap.has(s.id)) {
            const settledXp = recordsList.reduce((sum, r) => {
              if (r.seasonId !== s.id || !r.done || r.deleted || r.settled === false) return sum;
              if (s.id !== 'TEST' && r.date > yesterday) return sum;
              return sum + (Number(r.xp) || 0);
            }, 0);
            floorMap.set(s.id, {
              seasonId: s.id,
              points: Math.floor(settledXp / 100) * 3,
              through: s.id === 'TEST' ? '2026-10-31' : yesterday,
              settledAt: new Date().toISOString()
            });
          }
        }

        const adventuresBySeason = raw.adventuresBySeason && typeof raw.adventuresBySeason === 'object' ? raw.adventuresBySeason : {};
        for (const [, v] of Object.entries(adventuresBySeason)) {
          if (v && typeof v === 'object') v.entries = toArray(v.entries);
        }

        return {
          ...raw,
          ok: true,
          records: recordsList,
          growthFloors: [...floorMap.values()],
          adventuresBySeason,
          sync: raw.sync || {}
        };
      }

      function normalizeMeta(raw) {
        const m = raw && typeof raw === 'object' ? raw : {};
        const statsBySeason = m.statsBySeason && typeof m.statsBySeason === 'object' ? m.statsBySeason : {};
        const skillsBySeason = m.skillsBySeason && typeof m.skillsBySeason === 'object' ? m.skillsBySeason : {};
        const careersBySeason = m.careersBySeason && typeof m.careersBySeason === 'object' ? m.careersBySeason : {};
        for (const [, v] of Object.entries(skillsBySeason)) {
          if (v && v.state) {
            v.state.learned = toArray(v.state.learned);
            v.state.legends = toArray(v.state.legends).map(l => ({ ...l, ingredients: toArray(l.ingredients), trees: toArray(l.trees) }));
          }
        }
        for (const [, c] of Object.entries(careersBySeason)) {
          if (c && typeof c === 'object') {
            c.history = toArray(c.history);
          }
        }
        return {
          statsBySeason,
          skillsBySeason,
          careersBySeason,
          rewards: toArray(m.rewards),
          ai: m.ai || { configured: false, month: todayKst().slice(0, 7), used: 0, limit: 10, jobs: [] }
        };
      }

      const LOCAL_META_CACHE_KEY = 'lifequest.meta.v4';
      const LOCAL_FB_AUTH_KEY = 'lifequest.firebase.auth';
      const LOCAL_CLIENT_CACHE_KEY = 'lifequest.client.v4';
      const APP_SNAPSHOT_KEY = 'lifequest.mvp.v2-confirmed-v1';
      const APP_DAYS_KEY = 'lifequest.mvp.v2';
      const APP_PENDING_KEY = 'lifequest.mvp.v2-pending-v1';
      let fbPermissionDenied = false;

      function clientRecordSignature(c) {
        if (!c || !Array.isArray(c.records)) return '';
        return c.records
          .map(r => `${r.recordId}:${r.done ? 1 : 0}:${r.deleted ? 1 : 0}:${r.xp}:${r.version}:${r.settled ? 1 : 0}:${r.collected ? 1 : 0}:${r.sourceValue ?? ''}:${r.sourceCount ?? 0}:${r.taskSyncPending ? 1 : 0}`)
          .sort()
          .join('|');
      }

      // 두 스냅샷(기존 캐시 vs 신규 수신)을 항목별 version 및 updatedAt 기준으로 병합하여
      // 새로고침 시 이전 스냅샷 때문에 자동체크(근력운동·일기쓰기 등)나 수동체크가 풀렸다가 다시 켜지는 현상을 원천 차단!
      function mergeClientSnapshots(base, incoming) {
        if (!base || !Array.isArray(base.records) || !base.records.length) return incoming;
        if (!incoming || !Array.isArray(incoming.records) || !incoming.records.length) return base;
        const baseTime = String(base.updatedAt || '');
        const incTime = String(incoming.updatedAt || '');
        const incIsNewer = !baseTime || (incTime && incTime >= baseTime);
        const recMap = new Map();

        for (const r of base.records) {
          if (r && r.recordId) recMap.set(r.recordId, r);
        }
        for (const r of incoming.records) {
          if (!r || !r.recordId) continue;
          const prev = recMap.get(r.recordId);
          if (!prev) {
            recMap.set(r.recordId, r);
            continue;
          }
          const vNew = Number(r.version) || 0;
          const vOld = Number(prev.version) || 0;
          if (vNew > vOld) {
            recMap.set(r.recordId, r);
          } else if (vNew === vOld && incIsNewer) {
            // 동일 버전일 때 이미 정산(settled)되었거나 수집(collected)된 정보는 강등하지 않음
            if (prev.settled && !r.settled && r.done === prev.done) continue;
            if (prev.collected && !r.collected) continue;
            recMap.set(r.recordId, r);
          }
        }

        const primary = incIsNewer ? incoming : base;
        const secondary = incIsNewer ? base : incoming;
        const floorMap = new Map();
        for (const g of [...toArray(secondary.growthFloors), ...toArray(primary.growthFloors)]) {
          if (!g || !g.seasonId) continue;
          const oldG = floorMap.get(g.seasonId);
          floorMap.set(g.seasonId, {
            seasonId: g.seasonId,
            points: Math.max(oldG ? Number(oldG.points) || 0 : 0, Number(g.points) || 0),
            through: String((oldG && oldG.through > g.through ? oldG.through : g.through) || ''),
            settledAt: String(g.settledAt || (oldG && oldG.settledAt) || '')
          });
        }

        return normalizeClient({
          ...secondary,
          ...primary,
          updatedAt: incIsNewer ? (incTime || baseTime) : baseTime,
          records: [...recMap.values()],
          growthFloors: [...floorMap.values()],
          adventuresBySeason: Object.keys(primary.adventuresBySeason || {}).length ? primary.adventuresBySeason : (secondary.adventuresBySeason || {}),
          sync: Object.keys(primary.sync || {}).length ? primary.sync : (secondary.sync || {})
        });
      }

      function buildFbUrl(path) {
        const cleanPath = String(path).replace(/^\/+/, '');
        let token = '';
        try {
          token = String(window.LQ_FIREBASE_AUTH || localStorage.getItem(LOCAL_FB_AUTH_KEY) || '').trim();
        } catch (_) {}
        return `${cleanFbUrl}/lifequest/${cleanPath}.json` + (token ? `?auth=${encodeURIComponent(token)}` : '');
      }

      function saveLocalMetaCache(metaObj) {
        if (!metaObj || typeof metaObj !== 'object') return;
        try { localStorage.setItem(LOCAL_META_CACHE_KEY, JSON.stringify(metaObj)); } catch (_) {}
      }

      function loadLocalMetaCache() {
        try {
          const raw = JSON.parse(localStorage.getItem(LOCAL_META_CACHE_KEY) || 'null');
          if (raw && typeof raw === 'object') return normalizeMeta(raw);
        } catch (_) {}
        return null;
      }

      function saveLocalClientCache(clientObj) {
        if (!clientObj || !Array.isArray(clientObj.records) || !clientObj.records.length) return;
        const validRecords = clientObj.records.filter(r =>
          r && VALID_ACTIVITY_IDS.has(r.activityId) &&
          /^\d{4}-\d{2}-\d{2}$/.test(r.date) &&
          typeof r.done === 'boolean' &&
          Number.isInteger(r.version) &&
          r.version >= 0
        );
        if (!validRecords.length) return;
        try {
          localStorage.setItem(LOCAL_CLIENT_CACHE_KEY, JSON.stringify({ ...clientObj, records: validRecords }));
        } catch (_) {}
        try {
          const existing = JSON.parse(localStorage.getItem(APP_SNAPSHOT_KEY) || 'null');
          localStorage.setItem(APP_SNAPSHOT_KEY, JSON.stringify({
            schema: 1,
            records: validRecords,
            growthFloors: Array.isArray(clientObj.growthFloors) ? clientObj.growthFloors : (existing?.growthFloors || []),
            lastRecordSync: clientObj.updatedAt || existing?.lastRecordSync || new Date().toISOString()
          }));
        } catch (_) {}
        // app.html의 첫 동기 렌더링(0ms)에서 체크 상태가 풀리지 않도록 STORAGE_KEY(lifequest.mvp.v2)도 즉시 동기화!
        try {
          const days = {};
          for (const r of validRecords) {
            if (!days[r.date]) days[r.date] = {};
            days[r.date][r.activityId] = r.done === true;
          }
          const pendingSaved = JSON.parse(localStorage.getItem(APP_PENDING_KEY) || '[]');
          if (Array.isArray(pendingSaved)) {
            for (const p of pendingSaved) {
              if (p && p.date && p.id && typeof p.done === 'boolean') {
                if (!days[p.date]) days[p.date] = {};
                days[p.date][p.id] = p.done;
              }
            }
          }
          localStorage.setItem(APP_DAYS_KEY, JSON.stringify({ days }));
        } catch (_) {}
      }

      function loadLocalClientCache() {
        let fromV4 = null;
        let fromSnap = null;
        try {
          const raw = JSON.parse(localStorage.getItem(LOCAL_CLIENT_CACHE_KEY) || 'null');
          const norm = normalizeClient(raw);
          if (norm && norm.records.length) fromV4 = norm;
        } catch (_) {}
        try {
          const snap = JSON.parse(localStorage.getItem(APP_SNAPSHOT_KEY) || 'null');
          if (snap && Array.isArray(snap.records) && snap.records.length) {
            const norm = normalizeClient({
              ok: true,
              records: snap.records,
              growthFloors: Array.isArray(snap.growthFloors) ? snap.growthFloors : [],
              sync: { lastSuccess: snap.lastRecordSync || '' },
              updatedAt: snap.lastRecordSync || new Date().toISOString()
            });
            if (norm && norm.records.length) fromSnap = norm;
          }
        } catch (_) {}
        if (fromV4 && fromSnap) return mergeClientSnapshots(fromSnap, fromV4);
        return fromV4 || fromSnap || null;
      }

      // 스크립트 시작 즉시 로컬 캐시를 메모리에 예열하여 첫 화면 로딩 지연을 0ms로 단축
      let cachedClient = loadLocalClientCache();
      if (cachedClient) saveLocalClientCache(cachedClient);
      let cachedMeta = loadLocalMetaCache();
      let lastBackgroundSyncAt = 0;
      let initialReadDone = false;

      // 조회(fetchFbClient) 중에는 절대 Firebase에 쓰기(writeFb)를 수행하지 않으며,
      // 기존 캐시와 항목별 버전을 비교·병합하여 오래된 스냅샷에 의해 체크가 풀리는 현상을 방지
      async function fetchFbClient() {
        try {
          const r = await fetch(buildFbUrl('client'), { cache: 'no-store' });
          if (r.status === 401 || r.status === 403) {
            fbPermissionDenied = true;
            return cachedClient;
          }
          if (!r.ok) return cachedClient;
          const d = await r.json();
          if (!d || typeof d !== 'object' || d.error) {
            if (d && String(d.error).toLowerCase().includes('permission')) fbPermissionDenied = true;
            return cachedClient;
          }
          fbPermissionDenied = false;
          const norm = normalizeClient(d);
          if (norm && norm.records.length) {
            const merged = mergeClientSnapshots(cachedClient, norm);
            cachedClient = merged;
            saveLocalClientCache(merged);
            return merged;
          }
          return cachedClient;
        } catch (_) {
          return cachedClient;
        }
      }

      // 초기 부팅(allowBridgeFallback = false) 시에는 브리지 대기로 인해 첫 화면(read)이 지연되지 않도록 즉시 반환
      async function fetchFbMeta(allowBridgeFallback = true) {
        try {
          const r = await fetch(buildFbUrl('meta'), { cache: 'no-store' });
          if (r.ok) {
            const d = await r.json();
            if (d && typeof d === 'object' && !d.error) {
              fbPermissionDenied = false;
              cachedMeta = normalizeMeta(d);
              saveLocalMetaCache(cachedMeta);
              return cachedMeta;
            }
          } else if (r.status === 401 || r.status === 403) {
            fbPermissionDenied = true;
          }
        } catch (_) {}

        if (allowBridgeFallback) {
          try {
            const bridgeRes = await bridgeCall({ action: 'meta-read' });
            if (bridgeRes && bridgeRes.ok && bridgeRes.meta) {
              cachedMeta = normalizeMeta(bridgeRes.meta);
              saveLocalMetaCache(cachedMeta);
              return cachedMeta;
            }
          } catch (_) {}
        }

        cachedMeta = cachedMeta || loadLocalMetaCache() || normalizeMeta(null);
        return cachedMeta;
      }

      // HTTP 상태 코드 검증 + Permission denied 시 브리지(meta-save)를 통해 서버 OAuth 권한으로 저장
      // 주의: 브라우저가 임의로 조합한 /client 전체 배열 덮어쓰기(client 전체 PUT)는 데이터 유실 방지를 위해 금지!
      async function writeFb(path, data) {
        const cleanPath = String(path).replace(/^\/+/, '');
        if (cleanPath === 'meta') {
          saveLocalMetaCache(data);
        }
        try {
          const res = await fetch(buildFbUrl(cleanPath), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          if (res.ok) {
            const body = await res.json().catch(() => null);
            if (!body || !body.error) return true;
          }
          if (res.status === 401 || res.status === 403) {
            fbPermissionDenied = true;
          }
        } catch (_) {}

        if (cleanPath === 'meta') {
          const bRes = await bridgeCall({ action: 'meta-save', meta: data });
          if (bRes && bRes.ok) return true;
        }
        const err = new Error('FIREBASE_WRITE_FAILED');
        err.code = 'CONNECTION_FAILED';
        throw err;
      }

      const prefetchShellPromise = fetch('./app.html')
        .then(r => (r.ok ? r.text() : null))
        .catch(() => null);

      let prefetchClientPromise;
      let prefetchMetaPromise;

      let bridgeSource = null;
      let bridgeOrigin = null;
      let resolveBridgeReady = null;
      const pending = new Map();
      const bridgeReady = new Promise(resolve => { resolveBridgeReady = resolve; });

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        if (!host.endsWith('-script.googleusercontent.com') || !event.data || event.data.channel !== CHANNEL) return;
        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            bridgeOrigin = event.origin;
            resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = pending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      const bridgeFrame = document.createElement('iframe');
      bridgeFrame.title = 'Life Quest 시트·Tasks 백업 연결';
      bridgeFrame.setAttribute('aria-hidden', 'true');
      bridgeFrame.tabIndex = -1;
      bridgeFrame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0;opacity:0';
      if (!window.google?.script?.run) bridgeFrame.src = GAS_URL + '?bridge=1';
      if (!window.google?.script?.run) document.body.appendChild(bridgeFrame);

      async function bridgeCall(payload) {
        if (window.google?.script?.run) {
          return new Promise((resolve,reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).lifeQuestBridgeRequest({...payload,sessionToken}));
        }
        let waitTimer;
        await Promise.race([
          bridgeReady,
          new Promise((_, reject) => {
            waitTimer = setTimeout(() => {
              const err = new Error('시트 브리지 연결 대기 초과');
              err.code = 'UPSTREAM_TIMEOUT';
              reject(err);
            }, 15000);
          })
        ]).finally(() => clearTimeout(waitTimer));

        return new Promise((resolve, reject) => {
          const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const timer = setTimeout(() => {
            pending.delete(id);
            const err = new Error('시트 브리지 응답 시간 초과');
            err.code = 'UPSTREAM_TIMEOUT';
            reject(err);
          }, 25000);
          pending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({ channel: CHANNEL, id, payload: {...payload, sessionToken} }, bridgeOrigin);
        });
      }

      async function syncRecoveryHabitToGrowthDashboard(activityId, records) {
        if (!['sobriety', 'gambling-free', 'moderation'].includes(activityId)) return;
        try {
          const res = await fetch(`${cleanFbUrl}/growth/data.json`, { cache: 'no-store' });
          if (!res.ok) return;
          const growthData = await res.json();
          if (!growthData || !Array.isArray(growthData.habitData)) return;
          const habit = growthData.habitData.find(h => h && h.id === activityId);
          if (!habit) return;
          const doneDates = [...new Set(records.filter(r => r.activityId === activityId && r.done && !r.deleted).map(r => r.date))].sort();
          habit.dates = doneDates;
          if (doneDates.length && (!habit.startDate || doneDates[0] < habit.startDate)) {
            habit.startDate = doneDates[0];
          }
          await fetch(`${cleanFbUrl}/growth/data.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(growthData)
          });
        } catch (_) {}
      }

      // 주간 전직 이력(careersBySeason) 보존 및 회차별 직업 산출
      const JOB_CATALOG = {
        vitality: [

      async function buildCareerForSeason(seasonId, records, meta, persistIfChanged = false) {
        const sObj = allSeasonsUpToToday().find(s => s.id === seasonId) || seasonForDate(todayKst());
        if (seasonId === 'TEST') {
          return {
            ok: true,
            season: 'TEST',
            beta: true,
            current: null,
            history: [],
            next: { round: 1, at: '2026-11-08T12:00:00+09:00' },
            seasons: allSeasonsUpToToday()
          };
        }

        const stats = meta.statsBySeason?.[seasonId]?.values || ZERO_STATS;
        const firstAnchorMs = Date.parse(shiftDateKey(sObj.start, 7) + 'T12:00:00+09:00');
        const nowMs = Date.now();
        const dueRounds = nowMs < firstAnchorMs
          ? 0
          : Math.min(12, Math.floor((nowMs - firstAnchorMs) / (7 * 86400000)) + 1);

        meta.careersBySeason = meta.careersBySeason || {};
        const stored = meta.careersBySeason[seasonId] || { history: [] };
        const history = toArray(stored.history);
        let dirty = false;

        for (let r = history.length + 1; r <= Math.max(1, dueRounds); r++) {
          const roundAtMs = firstAnchorMs + (r - 1) * 7 * 86400000;
          const roundAtIso = new Date(Math.min(nowMs, roundAtMs)).toISOString();
          const roundDay = shiftDateKey(sObj.start, r * 7);
          const recsUpToRound = toArray(records).filter(x => x && x.done && !x.deleted && x.date >= sObj.start && x.date <= roundDay);

          const areaWeights = { vitality: 0, agility: 0, intelligence: 0, willpower: 0, charisma: 0 };
          for (const rec of recsUpToRound) {
            if (['strength', 'sleep', 'protein', 'supplements'].includes(rec.activityId)) areaWeights.vitality += rec.xp || 10;
            else if (['steps', 'cardio', 'shuffle', 'hiking', 'marathon'].includes(rec.activityId)) areaWeights.agility += rec.xp || 10;
            else if (['english', 'blog', 'reading'].includes(rec.activityId)) areaWeights.intelligence += rec.xp || 10;
            else if (['smalltalk', 'eyecontact', 'budget', 'repayment'].includes(rec.activityId)) areaWeights.charisma += rec.xp || 10;
            else areaWeights.willpower += rec.xp || 10;
          }

          const ranked = STAT_KEYS
            .map(k => [k, (Number(stats[k]) || 0) * 100 + (areaWeights[k] || 0)])
            .sort((a, b) => b[1] - a[1]);
          const topStat = ranked[0]?.[0] || 'willpower';
          const pool = JOB_CATALOG[topStat] || JOB_CATALOG.willpower;
          const chosen = pool[(r - 1) % pool.length];

          history.push({
            round: r,
            at: roundAtIso,
            job: chosen,
            appearance: chosen.appearance
          });
          dirty = true;
        }

        if (dirty && persistIfChanged) {
          meta.careersBySeason[seasonId] = { history, updatedAt: new Date().toISOString() };
          cachedMeta = meta;
          try { await writeFb('meta', meta); } catch (_) {}
        }

        const current = history[history.length - 1] || null;
        const nextRound = history.length + 1;
        const next = nextRound <= 12
          ? { round: nextRound, at: new Date(firstAnchorMs + (nextRound - 1) * 7 * 86400000).toISOString() }
          : null;

        return {
          ok: true,
          season: seasonId,
          beta: false,
          current,
          history,
          next,
          seasons: allSeasonsUpToToday()
        };
      }

      window.__lifeQuestHybridCall = async (pathname, req) => {
        const started = Date.now();
        const today = todayKst();
        const activeSeason = seasonForDate(today);

        if (pathname.endsWith('/api/ai')) {
          const meta = cachedMeta || (await prefetchMetaPromise);
          return { ok: true, ...(meta.ai || { configured: false, month: today.slice(0, 7), used: 0, limit: 10, jobs: [] }) };
        }

        const action = req && req.action;

        if (action === 'read' && initialReadDone) {
          const freshFb = await fetchFbClient();
          if (freshFb) cachedClient = mergeClientSnapshots(cachedClient, freshFb);
          if (fbPermissionDenied && Date.now() - lastManualSetAt > 3000) {
            try {
              const fastBridge = await bridgeCall({ action: 'read' });
              if (fastBridge && fastBridge.ok && Array.isArray(fastBridge.records) && fastBridge.records.length) {
                cachedClient = mergeClientSnapshots(cachedClient, normalizeClient(fastBridge));
                saveLocalClientCache(cachedClient);
                if (fastBridge.meta) {
                  cachedMeta = normalizeMeta(fastBridge.meta);
                  saveLocalMetaCache(cachedMeta);
                }
              }
            } catch (_) {}
          }
        }

        let client = cachedClient || (await prefetchClientPromise);
        let meta = cachedMeta || (await prefetchMetaPromise);

        if (!client || !Array.isArray(client.records) || !client.records.length) {
          const localCached = loadLocalClientCache();
          if (localCached && localCached.records.length) {
            client = localCached;
            cachedClient = client;
          } else {
            try {
              const fastSheetData = await bridgeCall({ action: 'read' }).catch(() => null);
              if (fastSheetData && fastSheetData.ok && Array.isArray(fastSheetData.records) && fastSheetData.records.length) {
                client = normalizeClient(fastSheetData);
                if (fastSheetData.meta) {
                  meta = normalizeMeta(fastSheetData.meta);
                  cachedMeta = meta;
                  saveLocalMetaCache(meta);
                }
              } else {
                const sheetData = await bridgeCall({ action: 'syncAndRead' });
                if (sheetData && sheetData.ok && Array.isArray(sheetData.records)) {
                  client = normalizeClient(sheetData);
                  if (sheetData.meta) {
                    meta = normalizeMeta(sheetData.meta);
                    cachedMeta = meta;
                    saveLocalMetaCache(meta);
                  }
                }
              }
              if (client && Array.isArray(client.records) && client.records.length) {
                cachedClient = client;
                saveLocalClientCache(client);
              }
            } catch (_) {}
          }
          if (!client || !Array.isArray(client.records)) {
            client = normalizeClient({ ok: true, records: [], growthFloors: [], adventuresBySeason: {}, sync: {} });
          }
          cachedClient = client;
        }

        if (action === 'configure') {
          const rawKey = String(req.key || '').trim();
          if (!rawKey) return { ok: false, error: 'INVALID_KEY', timing: { totalMs: Date.now() - started } };
          try { localStorage.setItem(LOCAL_FB_AUTH_KEY, rawKey); } catch (_) {}
          await bridgeCall({ action: 'configure', key: rawKey }).catch(() => null);
          fbPermissionDenied = false;
          return { ok: true, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'read') {
          const wasFirstRead = !initialReadDone;
          initialReadDone = true;
          const nowMs = Date.now();
          const lastSyncMs = Date.parse(client?.sync?.lastSuccess || '') || 0;
          const slot1110Ms = Date.parse(today + 'T11:10:00+09:00');
          const slot1200Ms = Date.parse(today + 'T12:00:00+09:00');
          const crossed1110 = nowMs >= slot1110Ms && lastSyncMs < slot1110Ms;
          const crossed1200 = nowMs >= slot1200Ms && lastSyncMs < slot1200Ms;
          const hasOverdueSettlement = toArray(client.records).some(r =>
            r && r.done && !r.deleted && r.settled === false && r.settlesAt && nowMs >= Date.parse(r.settlesAt)
          );
          const needFullAutoSync = !lastSyncMs || (nowMs - lastSyncMs > 10 * 60 * 1000) || crossed1110 || crossed1200 || hasOverdueSettlement;

          if ((nowMs - lastBackgroundSyncAt > 30000 || hasOverdueSettlement || crossed1110 || crossed1200) && nowMs - lastManualSetAt > 8000) {
            lastBackgroundSyncAt = nowMs;
            const beforeSig = clientRecordSignature(client);
            setTimeout(() => {
              if (Date.now() - lastManualSetAt < 8000) return;
              bridgeCall({ action: needFullAutoSync ? 'syncAndRead' : 'read' })
                .then(async fresh => {
                  if (!fresh || !fresh.ok || !Array.isArray(fresh.records)) return;
                  if (fresh.meta) {
                    cachedMeta = normalizeMeta(fresh.meta);
                    saveLocalMetaCache(cachedMeta);
                  }
                  const merged = mergeClientSnapshots(cachedClient, normalizeClient(fresh));
                  const afterSig = clientRecordSignature(merged);
                  cachedClient = merged;
                  saveLocalClientCache(merged);
                  if (afterSig !== beforeSig && Date.now() - lastManualSetAt > 8000) {
                    try {
                      appFrame.contentWindow.document.getElementById('refreshCloud')?.click();
                    } catch (_) {}
                  }
                })
                .catch(() => {});
            }, wasFirstRead ? 400 : 1200);
          }
          const career = await buildCareerForSeason(activeSeason.id, client.records, meta, false);
          return {
            ok: true,
            records: client.records,
            growthFloors: client.growthFloors,
            career,
            sync: client.sync || {},
            timing: { totalMs: Date.now() - started }
          };
        }

        // 실패한 하위 단계(Firebase engine 업로드 / Firebase client 업로드 / Tasks 반영)만 별도로 재시도하는 타이머
        function scheduleStepRetry(delayMs = 5000) {
          if (window.__lqStepRetryTimer) return;
          window.__lqStepRetryCount = (window.__lqStepRetryCount || 0) + 1;
          if (window.__lqStepRetryCount > 6) return;
          window.__lqStepRetryTimer = setTimeout(async () => {
            window.__lqStepRetryTimer = null;
            try {
              const retryRes = await bridgeCall({ action: 'retry-sync' });
              if (!retryRes || !retryRes.ok) {
                // BUSY 등 서버 잠금 경합이나 일시적 오류 응답 시에도 다음 재시도를 예약
                scheduleStepRetry(Math.min(60000, 10000 * window.__lqStepRetryCount));
                return;
              }
              if (Array.isArray(retryRes.records)) {
                const merged = mergeClientSnapshots(cachedClient, normalizeClient(retryRes));
                cachedClient = merged;
                saveLocalClientCache(merged);
                if (retryRes.anySyncPending) {
                  // 상태 변화 없이(예: 삭제된 Task로 인해) 대기만 남은 경우 백오프 간격을 늘려 불필요한 호출 방지
                  const nextDelay = retryRes.stateChanged ? 15000 : Math.min(60000, 20000 * window.__lqStepRetryCount);
                  scheduleStepRetry(nextDelay);
                } else {
                  window.__lqStepRetryCount = 0;
                  try {
                    appFrame.contentWindow.document.getElementById('refreshCloud')?.click();
                  } catch (_) {}
                }
              }
            } catch (_) {
              scheduleStepRetry(Math.min(60000, 15000 * window.__lqStepRetryCount));
            }
          }, delayMs);
        }

        // 원자적 수동 체크/취소(action === 'set'):
        // 1) 서버 브리지(lifeQuestBridgeRequest)를 먼저 호출해 expectedVersion 충돌 검증, 엔진 원본(engineSaved),
        //    Firebase 엔진 업로드(engineUploaded), 다른 기기용 화면 데이터 업로드(clientUploaded), Tasks 반영(taskSyncPending)을 각각 확인
        // 2) 엔진 원본 저장 자체가 실패(engineSaved === false)했으면 실패를 반환해 SaveQueue가 재시도하도록 하고,
        //    엔진 원본은 저장됐으나 Firebase 업로드나 Tasks 반영이 밀렸다면 taskSyncPending: true로 표시 후 실패한 단계만 retry-sync로 재시도!
        if (action === 'set') {
          const date = String(req.date || today);
          const activityId = String(req.activityId || '');
          const done = req.done === true;
          const expectedVersion = Number.isInteger(req.expectedVersion) ? req.expectedVersion : 0;

          lastManualSetAt = Date.now();
          let res;
          try {
            res = await bridgeCall({
              action: 'set',
              date,
              activityId,
              done,
              expectedVersion
            });
          } catch (err) {
            return {
              ok: false,
              error: err && err.code ? err.code : 'CONNECTION_FAILED',
              timing: { totalMs: Date.now() - started }
            };
          }

          if (!res || !res.ok || res.engineSaved === false) {
            if (res && res.record && client && Array.isArray(client.records)) {
              const cIdx = client.records.findIndex(r => r.date === res.record.date && r.activityId === res.record.activityId);
              if (cIdx >= 0) client.records[cIdx] = res.record;
              else client.records.push(res.record);
              cachedClient = normalizeClient(client);
              saveLocalClientCache(cachedClient);
            }
            return {
              ok: false,
              error: (res && res.error) || 'UPSTREAM_UNAVAILABLE',
              record: res ? res.record : undefined,
              timing: { totalMs: Date.now() - started }
            };
          }

          const engineUploaded = res.engineUploaded !== false;
          const clientUploaded = res.clientUploaded !== false;
          const firebaseSyncPending = Boolean(!engineUploaded || !clientUploaded || res.firebaseSyncPending);
          const taskSyncPending = Boolean(res.taskSyncPending);
          const anySyncPending = Boolean(taskSyncPending || firebaseSyncPending);

          const confirmedRec = Object.assign({}, res.record, {
            engineSaved: true,
            engineUploaded,
            clientUploaded,
            firebaseSyncPending,
            taskSyncPending,
            anySyncPending
          });
          const idx = client.records.findIndex(r => r.date === date && r.activityId === activityId);
          if (idx >= 0) client.records[idx] = confirmedRec;
          else client.records.push(confirmedRec);

          if (res.adventures && client.sync) {
            client.sync.adventure = res.adventures;
          }
          if (client.sync) {
            client.sync.engineSyncPending = !engineUploaded;
            client.sync.clientSyncPending = !clientUploaded;
            client.sync.firebaseSyncPending = firebaseSyncPending;
            client.sync.taskPending = taskSyncPending ? Math.max(1, Number(client.sync.taskPending) || 0) : 0;
            client.sync.pending = (taskSyncPending ? 1 : 0) + (!engineUploaded ? 1 : 0) + (!clientUploaded ? 1 : 0);
          }
          cachedClient = normalizeClient(client);
          saveLocalClientCache(cachedClient);

          if (anySyncPending) {
            window.__lqStepRetryCount = 0;
            scheduleStepRetry(4000);
          }
          void syncRecoveryHabitToGrowthDashboard(activityId, cachedClient.records);

          return {
            ok: true,
            record: confirmedRec,
            engineSaved: true,
            engineUploaded,
            clientUploaded,
            firebaseUploaded: Boolean(engineUploaded && clientUploaded),
            firebaseSyncPending,
            taskSyncPending,
            anySyncPending,
            adventures: res.adventures || cachedClient.sync?.adventure || null,
            timing: { totalMs: Date.now() - started }
          };
        }

        if (action === 'stats-read') {
          meta = await fetchFbMeta();
          const alloc = meta.statsBySeason?.[activeSeason.id] || { values: { ...ZERO_STATS }, revision: 0 };
          const skillSpent = meta.skillsBySeason?.[activeSeason.id]?.state?.spentPoints || 0;
          return { ok: true, allocation: alloc, skillSpent, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'stats-save') {
          const sId = req.season || activeSeason.id;
          if (sId !== activeSeason.id) {
            return { ok: false, error: 'SEASON_READ_ONLY', timing: { totalMs: Date.now() - started } };
          }
          meta = await fetchFbMeta();
          const currentAlloc = meta.statsBySeason?.[sId] || { values: { ...ZERO_STATS }, revision: 0 };
          if (!Number.isInteger(req.expectedRevision) || req.expectedRevision !== (currentAlloc.revision || 0)) {
            return { ok: false, error: 'STAT_CONFLICT', timing: { totalMs: Date.now() - started } };
          }

          const nextValues = { ...ZERO_STATS };
          for (const k of STAT_KEYS) {
            const v = req.values?.[k];
            if (!Number.isSafeInteger(v) || v < 0) {
              return { ok: false, error: 'INVALID_STATS', timing: { totalMs: Date.now() - started } };
            }
            nextValues[k] = v;
          }

          const sObj = allSeasonsUpToToday().find(s => s.id === sId) || activeSeason;
          const xp = client.records.reduce((sum, r) => sum + (r.done && !r.deleted && r.settled !== false && r.date >= sObj.start && r.date <= sObj.end ? r.xp : 0), 0);
          const earned = client.growthFloors.find(g => g.seasonId === sId)?.points ?? (Math.floor(xp / 100) * 3);
          const allocated = STAT_KEYS.reduce((sum, k) => sum + nextValues[k], 0);
          const skillSpent = meta.skillsBySeason?.[sId]?.state?.spentPoints || 0;

          if (allocated + skillSpent > earned) {
            return { ok: false, error: 'POINT_BUDGET', timing: { totalMs: Date.now() - started } };
          }

          const nextRev = (currentAlloc.revision || 0) + 1;
          meta.statsBySeason[sId] = { values: nextValues, revision: nextRev };
          cachedMeta = meta;
          await writeFb('meta', meta);

          let adventureSyncPending = false;
          try {
            await bridgeCall({ action: 'adventure-stats', adventureStats: { season: sId, revision: nextRev, values: nextValues } });
          } catch (_) {
            adventureSyncPending = true;
          }

          return {
            ok: true,
            allocation: meta.statsBySeason[sId],
            skillSpent,
            adventureSyncPending,
            timing: { totalMs: Date.now() - started }
          };
        }

        if (action === 'skills-read') {
          meta = await fetchFbMeta();
          const sId = req.season || activeSeason.id;
          const sObj = allSeasonsUpToToday().find(s => s.id === sId) || activeSeason;
          const skillEntry = meta.skillsBySeason?.[sId] || { state: { schema: 1, learned: [], legends: [], ultimate: null, spentPoints: 0 }, revision: 0 };
          const xp = client.records.reduce((sum, r) => sum + (r.done && !r.deleted && r.settled !== false && r.date >= sObj.start && r.date <= sObj.end ? r.xp : 0), 0);
          const level = Math.floor(xp / 100) + 1;
          const stats = meta.statsBySeason?.[sId]?.values || ZERO_STATS;
          const earned = client.growthFloors.find(g => g.seasonId === sId)?.points ?? (Math.floor(xp / 100) * 3);
          const allocated = Object.values(stats).reduce((a, b) => a + Number(b || 0), 0);
          const spent = skillEntry.state.spentPoints || 0;
          return {
            ok: true,
            season: sId,
            seasons: allSeasonsUpToToday(),
            state: skillEntry.state,
            revision: skillEntry.revision || 0,
            eligibility: { level, stats, remaining: Math.max(0, earned - allocated - spent) },
            timing: { totalMs: Date.now() - started }
          };
        }

        if (['skills-learn', 'skills-fuse', 'skills-ultimate'].includes(action)) {
          const sId = req.season || activeSeason.id;
          if (sId !== activeSeason.id) {
            return { ok: false, error: 'SEASON_READ_ONLY', timing: { totalMs: Date.now() - started } };
          }
          meta = await fetchFbMeta();
          const sObj = allSeasonsUpToToday().find(s => s.id === sId) || activeSeason;
          const skillEntry = meta.skillsBySeason?.[sId] || { state: { schema: 1, learned: [], legends: [], ultimate: null, spentPoints: 0 }, revision: 0 };

          if (!Number.isInteger(req.expectedRevision) || req.expectedRevision !== (skillEntry.revision || 0)) {
            return { ok: false, error: 'SKILL_CONFLICT', timing: { totalMs: Date.now() - started } };
          }

          const xp = client.records.reduce((sum, r) => sum + (r.done && !r.deleted && r.settled !== false && r.date >= sObj.start && r.date <= sObj.end ? r.xp : 0), 0);
          const level = Math.floor(xp / 100) + 1;
          const stats = meta.statsBySeason?.[sId]?.values || ZERO_STATS;
          const earned = client.growthFloors.find(g => g.seasonId === sId)?.points ?? (Math.floor(xp / 100) * 3);
          const allocated = Object.values(stats).reduce((a, b) => a + Number(b || 0), 0);
          const beforeSpent = Number(skillEntry.state.spentPoints) || 0;
          const remaining = Math.max(0, earned - allocated - beforeSpent);

          let transitioned;
          try {
            transitioned = skillTransition(skillEntry.state, req, { level, stats, at: new Date().toISOString() });
          } catch (err) {
            return { ok: false, error: String(err.message || err), timing: { totalMs: Date.now() - started } };
          }

          if (!transitioned.unchanged) {
            if (Number(req.expectedCost) !== transitioned.cost) {
              return { ok: false, error: 'SKILL_COST_CHANGED', timing: { totalMs: Date.now() - started } };
            }
            if (transitioned.cost > remaining) {
              return { ok: false, error: 'SKILL_POINTS', timing: { totalMs: Date.now() - started } };
            }
            skillEntry.state = transitioned.state;
            skillEntry.revision = (skillEntry.revision || 0) + 1;
            meta.skillsBySeason[sId] = skillEntry;
            cachedMeta = meta;
            await writeFb('meta', meta);
          }

          return {
            ok: true,
            state: skillEntry.state,
            revision: skillEntry.revision || 0,
            remaining: Math.max(0, earned - allocated - (skillEntry.state.spentPoints || 0)),
            timing: { totalMs: Date.now() - started }
          };
        }

        if (action === 'adventures-read') {
          const sId = req.season || activeSeason.id;
          let adv = client.adventuresBySeason?.[sId];
          if (!adv || req.before) {
            const res = await bridgeCall({ action: 'adventures-read', season: sId, before: req.before }).catch(() => null);
            adv = res?.adventures || adv || { enabled: true, season: sId, xp: 0, consumed: 0, baseline: 0, progress: 0, nextXp: 100, gold: 0, count: 0, lastError: '', entries: [], nextBefore: null };
          }
          return { ok: true, adventures: adv, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'season-report-read') {
          const sId = req.seasonId || activeSeason.id;
          const seasons = allSeasonsUpToToday();
          const season = seasons.find(s => s.id === sId) || activeSeason;
          const sRecords = client.records.filter(r => r.date >= season.start && r.date <= season.end && !r.deleted);
          return { ok: true, season, seasons, records: sRecords, activities: ACTIVITIES_CATALOG, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'seasons-read') {
          const seasons = allSeasonsUpToToday();
          const summaries = seasons.map(s => {
            const sRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.date >= s.start && r.date <= s.end);
            return { season_id: s.id, records: sRecs.length, recorded_xp: sRecs.reduce((sum, r) => sum + r.xp, 0) };
          });
          const archivedStats = Object.entries(meta.statsBySeason || {}).map(([seasonId, v]) => ({ seasonId, values: v.values || ZERO_STATS }));
          return { ok: true, seasons, summaries, archivedStats, activities: ACTIVITIES_CATALOG, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'rewards-read') {
          meta = await fetchFbMeta();
          return { ok: true, rewards: meta.rewards || [], timing: { totalMs: Date.now() - started } };
        }

        if (action === 'reward-claim') {
          meta = await fetchFbMeta();
          const sId = req.season || activeSeason.id;
          const rewardId = `${sId}:${req.questId}:${req.stage}`;
          let reward = (meta.rewards || []).find(r => r.reward_id === rewardId);
          if (!reward) {
            const sRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.date >= activeSeason.start && r.date <= today);
            const xp = sRecs.reduce((sum, r) => sum + r.xp, 0);
            const count = sRecs.filter(r => r.activityId === req.questId).reduce((sum, r) => sum + (req.questId === 'reading' ? (r.sourceCount || 1) : 1), 0);
            const career = await buildCareerForSeason(sId, client.records, meta, false);
            reward = {
              reward_id: rewardId,
              quest_id: req.questId,
              stage: Number(req.stage) || 1,
              season: sId,
              claimed_at: new Date().toISOString(),
              snapshot: { count, threshold: count, level: Math.floor(xp / 100) + 1, job: career.current?.job?.name || '견습 모험가' }
            };
            meta.rewards = [reward, ...(meta.rewards || [])];
            cachedMeta = meta;
            await writeFb('meta', meta);
          }
          return { ok: true, reward, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'careers-read') {
          meta = await fetchFbMeta();
          const sId = req.season || activeSeason.id;
          const careerData = await buildCareerForSeason(sId, client.records, meta, true);
          return { ...careerData, timing: { totalMs: Date.now() - started } };
        }

        if (action === 'profile-read') {
          meta = await fetchFbMeta();
          const sRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.date >= activeSeason.start && r.date <= today);
          const activeDaysSet = new Set(sRecs.map(r => r.date));
          const seasonRewards = (meta.rewards || []).filter(r => r.season === activeSeason.id);
          const career = await buildCareerForSeason(activeSeason.id, client.records, meta, true);

          const achievements = [
            { id: 'first', icon: '🌱', name: '첫 발자국', description: '이번 시즌 첫 활동 완료', title: '첫 기록의 목격자', count: sRecs.length, target: 1, unit: '건', unlocked: sRecs.length >= 1 },
            { id: 'days7', icon: '🔥', name: '일주일의 불꽃', description: '시즌 누적 활동일 7일 달성', title: '꾸준함의 순례자', count: activeDaysSet.size, target: 7, unit: '일', unlocked: activeDaysSet.size >= 7 },
            { id: 'days30', icon: '🛡️', name: '강철의 일과', description: '시즌 누적 활동일 30일 달성', title: '규율의 수호자', count: activeDaysSet.size, target: 30, unit: '일', unlocked: activeDaysSet.size >= 30 },
            { id: 'records50', icon: '⚔️', name: '백전의 실천가', description: '시즌 완료 기록 50건 달성', title: '왕립 실행관', count: sRecs.length, target: 50, unit: '건', unlocked: sRecs.length >= 50 }
          ];
          const unlocked = achievements.filter(a => a.unlocked);
          const sortedDates = [...activeDaysSet].sort();
          const recentDays = [...sortedDates].reverse().slice(0, 5).map(d => {
            const dRecs = sRecs.filter(r => r.date === d);
            return { date: d, count: dRecs.length, xp: dRecs.reduce((sum, r) => sum + r.xp, 0), activities: dRecs.map(r => r.activityId) };
          });

          const formalRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.seasonId !== 'TEST');
          const betaRecs = client.records.filter(r => r.done && !r.deleted && r.settled !== false && r.seasonId === 'TEST');

          return {
            ok: true,
            profile: {
              season: activeSeason,
              name: '연수홍',
              completed: sRecs.length,
              activeDays: activeDaysSet.size,
              rewards: seasonRewards.length,
              title: unlocked.length ? unlocked[unlocked.length - 1].title : '',
              career: career.current,
              achievements,
              firstDate: sortedDates[0] || '',
              days: recentDays,
              latestReward: seasonRewards[0] || null,
              participatedSeasons: new Set(formalRecs.map(r => r.seasonId)).size || 1,
              formalCompleted: formalRecs.length,
              betaCompleted: betaRecs.length
            },
            timing: { totalMs: Date.now() - started }
          };
        }

        return { ok: true, timing: { totalMs: Date.now() - started } };
      };

      const ADVENTURER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220">' +
        '<defs>' +
        '<radialGradient id="aura" cx="50%" cy="42%" r="48%"><stop offset="0%" stop-color="#f3d58d" stop-opacity="0.45"/><stop offset="65%" stop-color="#58b9b4" stop-opacity="0.18"/><stop offset="100%" stop-color="#071a20" stop-opacity="0"/></radialGradient>' +
        '<linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2b676e"/><stop offset="100%" stop-color="#123138"/></linearGradient>' +
        '<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6de9d"/><stop offset="100%" stop-color="#b88938"/></linearGradient>' +
        '</defs>' +
        '<circle cx="80" cy="96" r="72" fill="url(#aura)"/>' +
        '<circle cx="80" cy="96" r="56" fill="none" stroke="#d4ad62" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 4"/>' +
        '<path d="M44 192 L58 88 L102 88 L116 192 Z" fill="url(#cloak)" stroke="#d4ad62" stroke-width="1.8"/>' +
        '<path d="M54 92 Q80 112 106 92 L112 152 Q80 164 48 152 Z" fill="#1d464d" stroke="#d4ad62" stroke-width="1.4"/>' +
        '<circle cx="80" cy="60" r="20" fill="#eed9b3" stroke="#b88938" stroke-width="2"/>' +
        '<path d="M56 58 Q80 30 104 58 Q80 46 56 58 Z" fill="#17383f" stroke="#d4ad62" stroke-width="1.6"/>' +
        '<rect x="66" y="122" width="28" height="32" rx="4" fill="#243c35" stroke="url(#gold)" stroke-width="2"/>' +
        '<path d="M80 128 L80 148 M70 138 L90 138" stroke="#f6de9d" stroke-width="2"/>' +
        '<line x1="118" y1="48" x2="118" y2="194" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round"/>' +
        '<circle cx="118" cy="44" r="7" fill="#7ee8df" stroke="#f6de9d" stroke-width="2"/>' +
        '</svg>'
      );

      const BANNER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">' +
        '<defs>' +
        '<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2e36"/><stop offset="55%" stop-color="#194249"/><stop offset="100%" stop-color="#07191f"/></linearGradient>' +
        '<radialGradient id="moon" cx="24%" cy="32%" r="35%"><stop offset="0%" stop-color="#f4d894" stop-opacity="0.32"/><stop offset="100%" stop-color="#194249" stop-opacity="0"/></radialGradient>' +
        '</defs>' +
        '<rect width="640" height="260" fill="url(#sky)"/>' +
        '<rect width="640" height="260" fill="url(#moon)"/>' +
        '<path d="M0 210 Q140 160 280 205 T640 185 L640 260 L0 260 Z" fill="#0b2228" opacity="0.85"/>' +
        '<path d="M0 230 Q200 190 410 225 T640 210 L640 260 L0 260 Z" fill="#06151a"/>' +
        '</svg>'
      );

      function injectBridgeIntoAppHtml(rawHtml) {
        const closeTag = '<' + '/script>';
        const shim =
          '<script>\n' +
          '(() => {\n' +
          '  if ("serviceWorker" in navigator) {\n' +
          '    try { navigator.serviceWorker.register = () => Promise.resolve(); } catch (_) {}\n' +
          '  }\n' +
          '  try {\n' +
          '    const safeState = (state, title, url) => {\n' +
          '      try {\n' +
          '        const s = String(url || "");\n' +
          '        if (s.startsWith("#")) window.top.history.replaceState(state, title, window.top.location.pathname + window.top.location.search + s);\n' +
          '        else window.top.history.replaceState(state, title, window.top.location.pathname + window.top.location.search);\n' +
          '      } catch (_) {}\n' +
          '    };\n' +
          '    window.history.replaceState = safeState;\n' +
          '    window.history.pushState = safeState;\n' +
          '  } catch (_) {}\n' +
          '  const origFetch = window.fetch.bind(window);\n' +
          '  window.fetch = async (input, init = {}) => {\n' +
          '    const raw = typeof input === "string" ? input : (input && input.url ? input.url : "");\n' +
          '    let u;\n' +
          '    try { u = new URL(raw, "https://recoverist02.github.io"); } catch (_) { return origFetch(input, init); }\n' +
          '    if (!u.pathname.endsWith("/api/game") && !u.pathname.endsWith("/api/ai")) {\n' +
          '      return origFetch(input, init);\n' +
          '    }\n' +
          '    let body = {};\n' +
          '    if (init && init.body) { try { body = JSON.parse(init.body); } catch (_) {} }\n' +
          '    try {\n' +
          '      const res = await window.parent.__lifeQuestHybridCall(u.pathname, body);\n' +
          '      return new Response(JSON.stringify(res || { ok: false, error: "SERVER_ERROR" }), {\n' +
          '        status: 200,\n' +
          '        headers: { "Content-Type": "application/json" }\n' +
          '      });\n' +
          '    } catch (err) {\n' +
          '      return new Response(JSON.stringify({ ok: false, error: err && err.code ? err.code : "CONNECTION_FAILED" }), {\n' +
          '        status: 200,\n' +
          '        headers: { "Content-Type": "application/json" }\n' +
          '      });\n' +
          '    }\n' +
          '  };\n' +
          '})();\n' +
          closeTag;

        const cfRe = new RegExp('<script>\\(function\\(\\)\\{function c\\(\\)[\\s\\S]*?<' + '/script>', 'gi');

        let cleaned = String(rawHtml || '')
          .replace(cfRe, '')
          .replace("navigator.serviceWorker.register('/sw.js'", "Promise.resolve('/sw.js'")
          .replace(/location\.reload\(\)/g, 'window.top.location.reload()')
          .replace(/history\.replaceState\([^)]*\)/g, 'void 0')
          .replaceAll('adventurer-fullbody-v1.webp', new URL('adventurer-fullbody-v1.webp', document.baseURI).href)
          .replaceAll('profile-adventurer.webp', new URL('profile-adventurer.webp', document.baseURI).href)
          .replaceAll('woodland-backdrop-v1.webp', new URL('woodland-backdrop-v1.webp', document.baseURI).href)
          .replaceAll('journal-banner.webp', new URL('journal-banner.webp', document.baseURI).href)
          .replaceAll('inventory-banner.webp', new URL('inventory-banner.webp', document.baseURI).href);

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (m) => m + shim);
        }
        return shim + cleaned;
      }

      async function boot() {
        prefetchClientPromise = fetchFbClient();
        prefetchMetaPromise = fetchFbMeta(false);
        let text = await prefetchShellPromise;
        if (!text) {
          try {
            const r = await fetch('./인생게임%20site%20html%20소스.txt');
            if (r.ok) text = await r.text();
          } catch (_) {}
        }
        if (text && text.includes('LIFE QUEST')) {
          const warm = loadLocalClientCache();
          if (warm) saveLocalClientCache(warm);
          await Promise.race([
            Promise.all([prefetchClientPromise, prefetchMetaPromise]),
            new Promise(r => setTimeout(r, 200))
          ]);
          appFrame.onload = () => bootOverlay.classList.add('hidden');
          appFrame.srcdoc = injectBridgeIntoAppHtml(text);
          setTimeout(() => bootOverlay.classList.add('hidden'), 150);
          return;
        }
        bootStatus.innerHTML = '깃허브 저장소에 <b>app.html</b> 파일을 함께 업로드해 주세요.';
      }

      const authenticate = bridgeCall;
      const storageKey = 'private-app-session-v1';
      async function openPrivateApp() {
        const panel = document.createElement('dialog');
        panel.style.cssText = 'padding:24px;border:0;border-radius:16px;max-width:90vw;color:#122c30';
        panel.innerHTML = '<form><strong>개인용 앱 로그인</strong><p><label>4자리 PIN <input type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required size="5"></label></p><label><input type="checkbox" checked> 7일 유지</label> <button>로그인</button><p role="status"></p></form>';
        document.body.appendChild(panel);
        panel.addEventListener('cancel', event => event.preventDefault());
        panel.showModal();
        const form = panel.querySelector('form');
        const [pin, keep] = form.querySelectorAll('input');
        const status = form.querySelector('[role=status]');
        status.textContent = 'Google 계정 연결 확인 중…';
        bridgeCall({action:'pin-resume',sessionToken:''}).then(() => {
          if (panel.isConnected) status.textContent = '로그인 서버 연결됨';
        }).catch(error => {
          if (status.textContent !== 'Google 계정 연결 확인 중…') return;
          status.textContent = /LOGIN_REQUIRED/.test(error.message) ? '로그인 서버 연결됨' : describeFailure(error);
        });
        function describeFailure(error) {
          const message = String(error.message || '');
          if (/TRY_LATER/.test(message)) return '시도 횟수 제한에 도달했어. 15분 후 다시 시도해줘.';
          if (/INVALID_PIN/.test(message)) return '4자리 PIN을 확인해줘.';
          if (/PIN_NOT_CONFIGURED/.test(message)) return '서버에 4자리 PIN 설정이 필요해.';
          if (/연결 대기 초과/.test(message)) return '로그인 서버 브리지 연결에 실패했어. Apps Script 웹앱 배포 권한(모든 사용자)과 허용 도메인 설정을 확인해줘.';
          if (/응답 시간 초과/.test(message)) return '연결됐지만 서버 응답이 지연되고 있어. 다시 시도해줘.';
          if (/LOGIN_REQUIRED/.test(message)) return '서버에서 유효한 세션을 받지 못했어.';
          return '서버 요청 실패: ' + message.slice(0,180);
        }
        async function unlock(action) {
          const session = await authenticate(action);
          if (!session || typeof session.token !== 'string' || !(session.expiresAt > Date.now())) throw Error('LOGIN_REQUIRED');
          sessionToken = session.token;
          const remaining = session.expiresAt - Date.now();
          setTimeout(() => location.reload(), remaining);
          panel.remove();
          await boot();
        }
        sessionToken = localStorage.getItem(storageKey) || sessionStorage.getItem(storageKey) || '';
        form.onsubmit = async event => {
          event.preventDefault();
          status.textContent = 'PIN 확인 중…';
          form.querySelector('button').disabled = true;
          try {
            await unlock({action:'pin-login', pin:pin.value, keep:keep.checked});
            localStorage.removeItem(storageKey);
            sessionStorage.removeItem(storageKey);
            (keep.checked ? localStorage : sessionStorage).setItem(storageKey,sessionToken);
          } catch (error) {
            pin.value = '';
            status.textContent = describeFailure(error);
          } finally { form.querySelector('button').disabled = false; }
        };
        if (sessionToken) {
          form.querySelector('button').disabled = true;
          try { await unlock({action:'pin-resume', sessionToken}); }
          catch { sessionToken = ''; localStorage.removeItem(storageKey); sessionStorage.removeItem(storageKey); }
          finally { form.querySelector('button').disabled = false; }
        }
      }
      openPrivateApp();
    })();
  </script>
